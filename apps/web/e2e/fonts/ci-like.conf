<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Giả lập font mặc định của GitHub ubuntu-latest (không có Inter → sans-serif/system-ui = DejaVu Sans) để tái hiện E2E CI -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Inter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Inter Display</string></patelt></pattern>
    </rejectfont>
  </selectfont>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>ui-sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
