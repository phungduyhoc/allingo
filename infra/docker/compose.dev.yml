# Môi trường dev cục bộ: pnpm docker:up
name: allingo-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: allingo-postgres
    environment:
      POSTGRES_USER: allingo
      POSTGRES_PASSWORD: allingo
      POSTGRES_DB: allingo
      TZ: Asia/Ho_Chi_Minh
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c max_connections=200
               -c log_min_duration_statement=200
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U allingo -d allingo']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    container_name: allingo-redis
    command: ['valkey-server', '--save', '', '--appendonly', 'no', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: allingo-meilisearch
    environment:
      MEILI_MASTER_KEY: masterKey-dev-only
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meili:/meili_data

  # MinIO đã ngừng phát hành image cộng đồng (Docker Hub xoá minio/minio, minio/mc ngày 11/09/2026; quay.io đóng 24/09/2026).
  # Dev mặc định dùng driver lưu trữ fs (.env STORAGE_DRIVER=fs, ADR-0025) – hai dịch vụ dưới chỉ chạy khi bật profile `s3`
  # (`docker compose --profile s3 …`) và cần thay image S3 tương thích đã chọn qua ADR (SPEC-ISSUES S143).
  minio:
    image: minio/minio:latest
    profiles: ['s3']
    container_name: allingo-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Tạo bucket media/recordings/invoices một lần (invoices: PDF hoá đơn – Sprint 8)
  minio-init:
    image: minio/mc:latest
    profiles: ['s3']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/allingo-media local/allingo-recordings local/allingo-invoices &&
      mc anonymous set download local/allingo-media &&
      echo 'buckets ready'"

  mailpit:
    image: axllent/mailpit:latest
    container_name: allingo-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
  meili:
  minio:
