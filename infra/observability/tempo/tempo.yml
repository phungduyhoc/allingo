# Tempo đơn tiến trình – nhận OTLP từ otel-collector; giữ trace 7 ngày; metrics-generator đẩy span-metrics về Prometheus
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
storage:
  trace:
    backend: local
    local: { path: /var/tempo/traces }
    wal: { path: /var/tempo/wal }
compactor:
  compaction: { block_retention: 168h }
metrics_generator:
  registry: { external_labels: { source: tempo } }
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
overrides:
  defaults:
    metrics_generator: { processors: [service-graphs, span-metrics] }
