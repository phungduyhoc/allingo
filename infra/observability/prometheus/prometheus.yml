# Prometheus (S11) – scrape API/worker (/v1/metrics, Bearer METRICS_TOKEN), exporter DB/Redis/node, blackbox (uptime + chứng chỉ)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: dev   # staging/prod: đặt qua Terraform (managed Prometheus) hoặc bản sao cấu hình

rule_files:
  - rules/allingo-recording.yml
  - rules/allingo-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: allingo-api
    metrics_path: /v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels: { service: allingo-api }

  - job_name: allingo-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['host.docker.internal:9464']
        labels: { service: allingo-worker }

  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]
  - job_name: node
    static_configs: [{ targets: ['node-exporter:9100'] }]

  # Uptime ngoài cho /health/ready + landing (staging/prod: thêm Better Stack/UptimeRobot – docs/runbooks/on-call.md)
  - job_name: blackbox-http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://host.docker.internal:4000/v1/health/ready
          - http://host.docker.internal:3000/
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: 'blackbox:9115' }

  # Hạn chứng chỉ TLS (staging/prod) – alert CertificateExpiringSoon < 14 ngày
  - job_name: blackbox-tls
    metrics_path: /probe
    params: { module: [tls_connect] }
    static_configs:
      - targets: ['api.allingo.vn:443', 'allingo.vn:443', 'api-staging.allingo.vn:443']
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: 'blackbox:9115' }
