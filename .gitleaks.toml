# gitleaks (CI ci.yml – job Security): luật mặc định + loại trừ dữ liệu test KHÔNG phải secret.
title = "Allingo gitleaks"

[extend]
useDefault = true

[allowlist]
description = """Không phải secret: vector chữ ký với khoá GIẢ (S7, A90), tệp test/e2e (giá trị mẫu cố ý – test redaction S11),
JWT/khoá sinh cho load test (tests/load/.out – gitignored), tham chiếu tên biến môi trường (env.X) và khoá localStorage."""
paths = [
  '''apps/api/test/fixtures/payments/vectors\.json''',
  '''(^|/)[^/]+\.test\.ts$''',
  '''^apps/web/e2e/''',
  '''^tests/load/\.out/''',
]
regexTarget = "line"
regexes = [
  '''env\.[A-Z0-9_]+(\s*\|\|\s*undefined)?''',
  '''(?i)(storage|memory|cache)_?key\s*=\s*['"][a-z0-9_.:-]+['"]''',
  '''\b[A-Z0-9_]*KEY\s*=\s*['"]allingo[a-z0-9_.:-]*['"]''',
  # C3: khoá định danh nội dung đề tự biên soạn (key/group_key của câu, nhóm, passage IELTS) – không phải secret
  '''\b(group_)?key:\s*['"]ielts-[a-z0-9-]+['"]''',
]
