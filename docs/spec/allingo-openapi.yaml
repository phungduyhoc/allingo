      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
  /me/forecast:
    get:
      tags: [Learning]
      summary: Dự báo điểm có khoảng tin cậy & ngày sẵn sàng thi (GĐ4)
      description: |
        v1.1 – S10 – v0 "ước tính sơ bộ" (`label: preliminary_estimate`, `model_version: linreg-v0`): hồi quy tuyến tính trên điểm
        ước tính (bài có thang điểm 120 ngày gần nhất) → điểm tại ngày thi (hoặc +30 ngày), khoảng dự báo 80 %, kẹp thang điểm;
        `ready_date` = ngày đường xu hướng chạm mục tiêu (≤ ngày thi + 180 ngày). < 1 điểm → `status: insufficient_data`.
        Lưu learn.score_forecasts tối đa 1 lần/ngày. AI/knowledge tracing ở GĐ4.
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Forecast' } } } }
  /analytics/events:
    post:
      tags: [Growth]
      security: []
      summary: Sự kiện phễu từ client gửi server-side (landing_view, signup_start, checkout_start) – v1.1 – S10
      description: |
        Tuỳ chọn (khi trình chặn quảng cáo chặn PostHog JS). Chỉ nhận khi `consent = true` (người dùng đã đồng ý cookie phân tích),
        ngược lại 202 `accepted: false`. Có đăng nhập → distinct_id = sha256(user_id) (không gửi PII), không → `anonymous_id`.
        Sự kiện signup_done, diagnostic_done, first_attempt, order_paid do server phát từ outbox. Không có `POSTHOG_KEY` → 202
        `disabled`. Giới hạn 60 sự kiện/phút/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FunnelEventInput' }
      responses:
        '202': { description: Đã nhận, content: { application/json: { schema: { $ref: '#/components/schemas/FunnelEventResult' } } } }
        '400': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Billing
  /plans:
    get:
      tags: [Billing]
      security: []
      summary: Gói & giá hiện hành theo chương trình/khu vực
      description: 'v1.1 – S7: gói của chương trình + combo + gói credit + Free; `price.id` là `price_id` cho POST /orders; mỗi gói một giá hiện hành (valid_from ≤ now < valid_to).'
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: region, in: query, schema: { type: string, default: VN } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } }
  /promotions/validate:
    post:
      tags: [Billing]
      summary: Kiểm tra mã khuyến mãi (cho gói hoặc đổi trực tiếp)
      description: |
        v1.1 – S8 (đầy đủ): loại `percent | fixed | credit_bonus | trial_days` (S7 `amount` = `fixed`); điều kiện gói/loại gói/chương trình,
        người dùng mới (chưa có đơn đã thanh toán, tài khoản ≤ 30 ngày), thời gian, tổng lượt (đã dùng + đang giữ bởi đơn chờ thanh toán),
        lượt/người, tổng tối thiểu; không cộng dồn (một mã/đơn). Có `price_id`/`plan_id` → đánh giá như POST /orders; không gói → như
        POST /promotions/redeem (trial_days, credit_bonus standalone; mã cần đơn → `plan_required`). Luôn 200; `valid = false` kèm `reason`.
        v1.1 – S10: KHÔNG cần đăng nhập (trang /pricing cho khách): chưa đăng nhập → chỉ đánh giá điều kiện không phụ thuộc người dùng
        (mã, thời gian, gói/chương trình, tổng lượt, tổng tối thiểu, mức tối thiểu) và trả `requires_login: true` khi mã còn điều kiện
        theo người dùng (người dùng mới, lượt/người, dùng thử một lần) – kết quả cuối cùng kiểm lại khi tạo đơn/đổi mã. Ẩn danh giới
        hạn 30 lần/phút/IP → 429 `rate_limited`.
      security: [ {}, { bearerAuth: [] }, { cookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, maxLength: 40 }, plan_id: { type: string, format: uuid }, price_id: { type: string, format: uuid, description: 'v1.1 – một trong plan_id/price_id (tuỳ chọn từ S8)' }, program: { type: string, enum: [toeic, ielts, jlpt, hsk], description: 'v1.1 – S8: chương trình dùng thử (trial_days)' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromotionValidation' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /promotions/redeem:
    post:
      tags: [Billing]
      summary: Đổi mã không qua đơn – dùng thử Pro (trial_days) hoặc tặng credit (credit_bonus standalone) (v1.1 – S8)
      description: |
        trial_days → subscription `trialing` [now, now + N ngày) của gói `conditions.trial_plan_code` (mặc định `<program>_pro_monthly`),
        entitlements nguồn `trial`, KHÔNG cấp credit; một lần/người (UNIQUE) – đã dùng → 400 `details.promotion.reason = trial_already_used`,
        đang Pro → `already_pro`. Hết trial: job `subscription.expire` → `expired` + thông báo `billing.trial_ended`, hạ Free.
        credit_bonus standalone → ledger `promo` (lô hết hạn `conditions.credit_valid_days`). Outbox `promotion.redeemed`.
        Mã không áp dụng → 400 `validation_failed` (`details.promotion = {code, reason}`); khách → `guest_account`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionRedeemInput' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromotionRedeemResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /orders:
    post:
      tags: [Billing]
      summary: Tạo đơn hàng (giá chốt, mã giảm) – chưa thanh toán
      description: |
        v1.1 – S7: giá tính ở server từ `price_id` (ưu tiên) hoặc giá hiện hành của `plan_id`; `quantity` = 1 (B2C). Đơn `pending`
        hết hạn sau 30 phút (`expires_at`, job `order.expire`). `Idempotency-Key` (UUID) bắt buộc, phạm vi theo người dùng:
        cùng khoá + cùng body → 200 trả đơn cũ; cùng khoá khác body → 409 `conflict` (`details.reason = idempotency_key_reused`).
        Tài khoản khách → 403 (`details.reason = guest_account`); `ff.billing.checkout` tắt → 503 `feature_disabled`;
        mã giảm không áp dụng → 400 `validation_failed` (`details.promotion = {code, reason}`).
        v1.1 – S8: mã được khoá + GIỮ LƯỢT (reserved) trong cùng transaction tạo đơn; đơn chờ thanh toán cũ của chính người dùng với cùng
        mã bị thay thế (`expired`, nhả lượt); `discount` = số giảm, `promotion_id`; credit_bonus cộng credit khi thanh toán.
        `buyer_info` (hoá đơn điện tử): `type = business` bắt buộc `tax_code` (MST VN 10/13 số, kiểm tra chữ số), `company`, `address`
        – sai → 400 `validation_failed` (issues path `buyer_info.tax_code`…); cá nhân thiếu tên/email → hồ sơ tài khoản.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { price_id: { type: string, format: uuid, description: v1.1 }, plan_id: { type: string, format: uuid }, promotion_code: { type: string }, quantity: { type: integer, default: 1, minimum: 1, maximum: 1 }, buyer_info: { $ref: '#/components/schemas/BuyerInfo' } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '200': { description: Trùng Idempotency-Key – đơn đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /me/orders:
    get:
      tags: [Billing]
      summary: Lịch sử đơn hàng của tôi (v1.1 – S7)
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /orders/{orderId}:
    get:
      tags: [Billing]
      summary: Trạng thái đơn hàng, thanh toán, hoá đơn
      description: 'v1.1 – S7: web polling sau khi cổng chuyển về (hoặc nghe Socket.IO `order.updated`); đơn quá hạn được chuyển `expired` khi đọc; đơn của người khác → 404. v1.1 – S8: `invoice` (status pending → issued trong vài giây sau thanh toán; `pdf_url` ký 10 phút – gọi lại để lấy URL mới), `promotion`, `buyer_info`.'
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /orders/{orderId}/pay:
    post:
      tags: [Billing]
      summary: Khởi tạo thanh toán với cổng → URL/deeplink chuyển hướng
      description: |
        v1.1 – S7: tạo một lần thanh toán `initiated` (mã tham chiếu mới mỗi lần) rồi gọi cổng. Đơn `pending|failed|cancelled` chưa hết hạn
        mới trả được (khác → 409 `details.reason = order_not_payable`). Cổng không khả dụng (thiếu credential/không bật, payos/stripe chưa có
        adapter) → 503 `feature_disabled`; cổng từ chối/lỗi mạng → 502 `payment_failed`. `return_url` phải thuộc origin web (mặc định
        `${WEB}/checkout/result`); cổng chuyển trình duyệt về `GET /payments/return/{provider}` rồi API 302 tới `return_url?order_id=&status=&provider=`.
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [provider], properties: { provider: { type: string, enum: [vnpay, momo, zalopay, payos, stripe, mock] }, return_url: { type: string, format: uri }, locale: { type: string, enum: [vi, en] } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntent' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payments/providers:
    get:
      tags: [Billing]
      security: []
      summary: Cổng thanh toán khả dụng + cờ checkout (v1.1 – S7)
      description: 'Chỉ liệt kê cổng đã bật (PAYMENT_PROVIDERS) VÀ đủ credential; cổng thiếu cấu hình không xuất hiện → web ẩn nút. `mock` chỉ ở dev/test.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentProviders' } } } }
  /payments/return/{provider}:
    get:
      tags: [Webhooks]
      security: []
      summary: Cổng chuyển trình duyệt về sau thanh toán – CHỈ hiển thị (v1.1 – S7)
      description: 'Không cấp quyền. Xác minh chữ ký (nếu có) để hiển thị; trạng thái đọc từ DB. Mặc định 302 tới `return_url` của /pay kèm `order_id`, `status`, `provider`; `Accept: application/json` hoặc `?format=json` → 200 JSON.'
      parameters: [ { name: provider, in: path, required: true, schema: { type: string, enum: [vnpay, momo, zalopay, mock] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentReturn' } } } }
        '302': { description: Chuyển về trang kết quả của web }
        '404': { $ref: '#/components/responses/Error' }
  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      security: []
      summary: Callback IPN từ cổng (xác minh chữ ký, idempotent theo provider_txn_id)
      description: |
        v1.1 – S7: MoMo IPN (JSON, phản hồi 204), ZaloPay callback (`{data, mac, type}`, phản hồi `{return_code, return_message}`), mock (dev).
        Một transaction: payments (UNIQUE provider + provider_txn_id) → orders.paid → subscription/entitlements/credit → outbox `order.paid`.
        Sai chữ ký/payload → 400 (thân theo định dạng cổng) + audit `payment.webhook_rejected`; cổng không khả dụng → 404.
      parameters: [ { name: provider, in: path, required: true, schema: { type: string, enum: [vnpay, momo, zalopay, mock] } } ]
      requestBody: { content: { application/json: { schema: { type: object } }, application/x-www-form-urlencoded: { schema: { type: object } } } }
      responses:
        '200': { description: Theo định dạng từng cổng yêu cầu }
        '204': { description: MoMo – đã nhận IPN }
        '400': { description: Sai chữ ký / payload (thân theo định dạng cổng) }
        '404': { $ref: '#/components/responses/Error' }
    get:
      tags: [Webhooks]
      security: []
      summary: VNPay IPN (GET + query vnp_*) – v1.1 S7
      description: 'VNPay 2.1.0 gọi IPN URL bằng GET; phản hồi `{RspCode, Message}` (00 xác nhận · 01 không thấy đơn · 02 đã xác nhận · 04 sai số tiền · 97 sai chữ ký → HTTP 400 · 99 lỗi).'
      parameters: [ { name: provider, in: path, required: true, schema: { type: string, enum: [vnpay, momo, zalopay, mock] } } ]
      responses:
        '200': { description: '{ RspCode, Message }' }
        '400': { description: Sai chữ ký }
        '404': { $ref: '#/components/responses/Error' }
  /me/subscriptions:
    get:
      tags: [Billing]
      summary: Gói đang có theo chương trình, chu kỳ, trạng thái gia hạn
      description: 'v1.1 – S7: gồm kỳ nối tiếp đã mua (`upcoming = true`, mua lại cùng gói khi còn hạn); `is_current`, `days_left`.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } }
  /me/subscriptions/{subscriptionId}/cancel:
    post:
      tags: [Billing]
      summary: Huỷ gia hạn (dùng đến hết chu kỳ)
      description: 'v1.1 – S7: `cancel_at_period_end = true`, giữ quyền tới `current_period_end`, ngừng cấp credit tháng; gọi lại → 200 không đổi; lifetime/đã hết hạn → 409.'
      parameters: [ { name: subscriptionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/credits:
    get:
      tags: [Billing]
      summary: Số dư credit, sắp hết hạn, bảng giá credit theo tác vụ
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreditBalance' } } } }
  /me/credits/ledger:
    get:
      tags: [Billing]
      summary: Lịch sử credit (nạp/tiêu)
      description: 'v1.1 – S7: reason ∈ purchase | subscription_grant | consume | refund | expire | admin_adjust …; cursor theo id giảm dần.'
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /me/entitlements:
    get:
      tags: [Billing]
      summary: Quyền tính năng & hạn mức còn lại hôm nay/tháng này (client dùng để gating UI)
      description: 'v1.1 – S7: bảng gating dùng chung `packages/config/entitlements.ts` (FEATURE_GATES); thiếu quyền → 403 `forbidden` `{feature, program, gate, upgrade}`, hết quota → 429 `quota_exceeded`, thiếu credit → 402 `insufficient_credits`.'
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlements' } } } }

  # ---------------------------------------------------------------- Growth
  /me/notification-preferences:
    get:
      tags: [Growth]
      summary: Kênh & khung giờ thông báo
      description: 'v1.1 – S6: chưa có hàng → trả mặc định DDL (email/push/inapp bật, zalo tắt, 22:00–07:00, nhắc 20:00). v1.1 – S8: `categories` (learning/billing/marketing × email/push/inapp; marketing email theo đồng ý marketing khi chưa lưu), `frequency` (≤ 1 email marketing/7 ngày, ≤ 2 push/ngày – chỉ đọc), `timezone` (giờ yên lặng theo Asia/Ho_Chi_Minh).'
