      description: |
        v1.1 – S10: mục tạo từ outbox `attempt.graded` (mỗi câu sai/bỏ trống một mục, gộp theo câu: `occurrences`, mở lại nếu đã
        hiểu mà sai lại). Lọc `kind` (loại hiệu lực = reason_override ?? error_kind), `part` (section code), `status` open | resolved
