      summary: Khoá công khai VAPID cho pushManager.subscribe (công khai, v1.1 – S6)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { public_key: { type: [string, 'null'] }, enabled: { type: boolean } } } } } }
  /me/notifications:
    get:
      tags: [Growth]
      summary: Thông báo in-app
      description: 'v1.1 – S7: billing.subscription_expiring (7/3/1 ngày trước hết kỳ), billing.subscription_expired, billing.order_paid; web dịch theo `template_code` + `payload`. v1.1 – S8: mọi mẫu NotificationService (billing.invoice_issued, billing.trial_*, growth.referral_rewarded, learning.*), `title`/`body`/`url` đã dựng theo ngôn ngữ người dùng (dự phòng), `unread=true` chỉ chưa đọc, `unread_count`; realtime Socket.IO `notification.new`.'
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { name: unread, in: query, schema: { type: boolean }, description: 'v1.1 – S8' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationItem' } }, next_cursor: { type: [string, 'null'] }, unread_count: { type: integer, description: 'v1.1 – S8' } } } } } }
  /me/notifications/{notificationId}/read:
    post:
      tags: [Growth]
      summary: Đánh dấu đã đọc một thông báo in-app (v1.1 – S8)
      description: 'Idempotent; thông báo của người khác → 404.'
      parameters: [ { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationItem' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /me/notifications/read-all:
    post:
      tags: [Growth]
      summary: Đánh dấu đã đọc tất cả thông báo in-app (v1.1 – S8)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { updated: { type: integer }, unread_count: { type: integer } } } } } }
  /notifications/unsubscribe:
    get:
      tags: [Growth]
      security: []
      summary: Link huỷ đăng ký trong email – chuyển tới trang quản lý thông báo của web (v1.1 – S8)
      description: 'Không đổi trạng thái (email client hay tải trước link). Token ký HMAC (`v1.<user>.<category|all>.<sig>`, không hết hạn); sai → 400. 302 tới `${WEB}/notifications/manage?token=&unsubscribe=<category>`.'
      parameters: [ { name: token, in: query, required: true, schema: { type: string } } ]
      responses:
        '302': { description: Chuyển tới trang quản lý của web }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [Growth]
      security: []
      summary: Huỷ nhận email một loại (one-click RFC 8058 `List-Unsubscribe-Post`) (v1.1 – S8)
      description: 'Tắt `categories.<category>.email` (token `all` → mọi loại). Email giao dịch (biên lai, hoá đơn) vẫn gửi. Body tuỳ ý (`List-Unsubscribe=One-Click`).'
      parameters: [ { name: token, in: query, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { unsubscribed: { type: boolean }, category: { type: string, enum: [learning, billing, marketing, all] }, channel: { type: string, enum: [email] } } } } } }
        '400': { $ref: '#/components/responses/Error' }
