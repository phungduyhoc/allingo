      summary: Thêm học viên (email/mời), cấp seat
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [emails], properties: { emails: { type: array, items: { type: string, format: email } } } } } } }
      responses: { '201': { description: Đã mời } }
  /classes/{classId}/assignments:
    post:
      tags: [B2B]
      summary: Giao bài (đề/bài học/Writing/Speaking) kèm hạn
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentInput' } } } }
      responses: { '201': { description: OK } }
  /classes/{classId}/report:
    get:
      tags: [B2B]
      summary: "Báo cáo lớp: tiến độ, điểm ước tính, hoàn thành bài giao"
      parameters: [ { $ref: '#/components/parameters/ClassId' }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK } }

  # ---------------------------------------------------------------- Admin
  /admin/questions:
    get:
      tags: [Admin]
      summary: Tìm câu hỏi theo trạng thái/Part/dạng/nguồn
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: status, in: query, schema: { type: string } }, { name: section, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string }, description: 'Tìm trong đề bài (v1.1)' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: OK } }
    post:
      tags: [Admin]
      summary: Tạo câu hỏi (phiên bản 1, trạng thái draft)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminQuestionInput' } } } }
      responses: { '201': { description: OK } }
  /admin/questions/{questionId}/versions:
    get:
      tags: [Admin]
      summary: Lịch sử phiên bản câu hỏi (v1.1 – Sprint 2)
      parameters: [ { name: questionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK } }
    post:
      tags: [Admin]
      summary: Tạo phiên bản mới cho câu hỏi
      parameters: [ { name: questionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: object }, metadata: { type: object }, change_note: { type: string } } } } } }
      responses: { '201': { description: OK } }
  /admin/content/{entityType}/{entityId}/review:
    post:
      tags: [Admin]
      summary: Ghi quyết định duyệt (AI check / GV1 / GV2) → chuyển trạng thái
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string, enum: [question, passage, lesson, exercise, video, vocab_item] } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [stage, decision], properties: { stage: { type: string, enum: [ai_check, review1, review2] }, decision: { type: string, enum: [approve, reject, needs_change, submit, retire, reopen], description: 'approve/reject/needs_change ghi content_reviews; submit/retire/reopen là mốc chuyển trạng thái (v1.1)' }, notes: { type: string } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /admin/questions/{questionId}/ai-check:
    post:
      tags: [Admin]
      summary: Chạy AI kiểm tra (check_question) cho bản đang soạn và ghi review stage ai_check (v1.1 – Sprint 2)
      parameters: [ { name: questionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } }
  /admin/generate/questions:
    post:
      tags: [Admin]
      summary: Sinh lô câu hỏi bằng AI theo schema → Nháp + AI check tự động (job)
      description: |
        v1.1 – Sprint 5. Job `content.generate`: generate_questions (lô 10) → draft `source = ai` (external_ref `ai-gen:<job_id>:<n>`)
        → check_question (review stage ai_check) → dedup: embedding cosine ≥ 0,92 với câu published cùng chương trình + section
        (ai.embeddings), pg_trgm ≥ 0,85, trùng trong lô → `duplicate.flagged`. Quyền editor/teacher/admin.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [program, section, question_type, count], properties: { program: { type: string }, section: { type: string }, question_type: { type: string }, topic: { type: string }, difficulty: { type: string }, count: { type: integer, minimum: 1, maximum: 50 }, passage_id: { type: string, format: uuid } } } } } }
      responses:
        '202': { description: job_id, content: { application/json: { schema: { type: object, properties: { job_id: { type: string, format: uuid }, status: { type: string }, mode: { type: string, enum: [queued, inline] }, poll_url: { type: string } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /admin/generate/questions/{jobId}:
    get:
      tags: [Admin]
      summary: Trạng thái / kết quả job sinh câu hỏi AI (v1.1 – Sprint 5)
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateQuestionsJob' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/test-sets/generate:
    post:
      tags: [Admin]
      summary: "Sinh đề mini ngẫu nhiên lặp lại được (seed, PRNG mulberry32) từ ngân hàng câu đã phát hành → catalog.test_sets kind=mini (v1.1 – Sprint 4)"
      description: |
        Quyền editor/admin. Blueprint mặc định TOEIC 60 câu: P1 6 · P2 10 · P3 9 (3 hội thoại) · P4 9 (3 bài nói) · P5 10 · P6 4 (1 đoạn) ·
        P7 12 (đoạn đơn + ≥ 1 bộ nhiều văn bản). Nhóm passage luôn lấy trọn; kết quả qua kiểm tra cấu trúc `mini`. Cùng `seed` + cùng
        ngân hàng (`bank_fingerprint`) → cùng câu; cùng `code` → cập nhật đề cũ. Ngân hàng thiếu → `shortfall` (vẫn tạo nếu ≥ 1 câu).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateTestSetInput' } } } }
      responses:
        '201': { description: Đã tạo/cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateTestSetResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/prompts:
    get:
      tags: [Admin]
      summary: Prompt templates & phiên bản
      description: 'v1.1 – Sprint 5: mỗi template kèm route (model_routes) và phiên bản (status, canary_percent, latest_eval).'
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PromptTemplate' } } } } } } } }
    post:
      tags: [Admin]
      summary: Tạo prompt template (code thuộc 14 task_code; program tuỳ chọn) – v1.1 Sprint 5
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string }, program: { type: string, nullable: true }, description: { type: string } } } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromptTemplate' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /admin/prompts/{templateId}/versions:
    post:
      tags: [Admin]
      summary: Tạo phiên bản prompt (draft) kèm rubric/output schema/model policy
      parameters: [ { name: templateId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromptVersionInput' } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromptVersion' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/prompts/versions/{versionId}/status:
    patch:
      tags: [Admin]
      summary: draft → canary(x%) → active → retired; chặn active nếu eval chưa đạt
      description: |
        v1.1 – Sprint 5. canary/active cần một `ai.eval_runs` của phiên bản với `passed = true`, KHÔNG phải mock, metrics đạt
        `eval.thresholds` (allingo-prompts.yaml) → thiếu: 409 `conflict`, `details.reason = eval_required`, `details.eval_gate`.
        `ALLOW_UNEVALUATED_ACTIVATION=true` chỉ có hiệu lực ở APP_ENV development/test. Kích hoạt → active cũ thành retired,
        cache giải thích của phiên bản cũ bị xoá. Hợp lệ: draft→canary|active|retired, canary→draft|active|retired, active→retired
        (cần canary thay thế), retired→draft. canary_percent 1–50 (mặc định 10), chia người dùng theo hash user_id ổn định.
      parameters: [ { name: versionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [draft, canary, active, retired] }, canary_percent: { type: integer, minimum: 1, maximum: 50 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { version: { $ref: '#/components/schemas/PromptVersion' }, changed: { type: boolean }, eval_gate: { type: object, nullable: true }, retired_version_ids: { type: array, items: { type: string, format: uuid } }, invalidated_cache_rows: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/eval-runs:
    get:
      tags: [Admin]
      summary: Danh sách eval run (mới nhất trước) – v1.1 Sprint 5
      parameters: [ { name: task_code, in: query, schema: { type: string } }, { name: prompt_version_id, in: query, schema: { type: string, format: uuid } }, { name: eval_set_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/EvalRun' } }, next_cursor: { type: [string, 'null'] } } } } } } }
    post:
      tags: [Admin]
      summary: Chạy eval set với phiên bản prompt/model (job)
      description: 'v1.1 – Sprint 5: job `eval.run`; provider mock → run ghi `metrics.mock = true`, `passed = false` (không mở cổng kích hoạt).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [eval_set_id, prompt_version_id], properties: { eval_set_id: { type: string, format: uuid }, prompt_version_id: { type: string, format: uuid }, model: { type: string } } } } } }
      responses: { '202': { description: run_id, content: { application/json: { schema: { type: object, properties: { run_id: { type: string, format: uuid }, status: { type: string }, mock: { type: boolean }, job_id: { type: string }, mode: { type: string } } } } } } }
  /admin/orders/{orderId}/refund:
    post:
      tags: [Admin]
      summary: Hoàn tiền thủ công (v1.1 – S7)
      description: 'Đơn `paid` → `refunded`; subscription của đơn kết thúc ngay, entitlements hết hiệu lực, credit còn lại thu hồi (ledger `refund` âm, không làm số dư âm – phần đã tiêu ghi `shortfall`); payments → `refunded`; outbox `order.refunded`; audit `order.refund`. Tiền trả lại khách thao tác ngoài hệ thống (runbook) – API hoàn tiền tự động của cổng: S8.'
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 }, revoke_credits: { type: boolean, default: true } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { order: { $ref: '#/components/schemas/Order' }, revoked: { type: object }, provider_refund: { type: object } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/billing/orders:
    get:
      tags: [Admin]
      summary: Danh sách đơn có lọc (v1.1 – S7)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, paid, failed, cancelled, refunded, expired] } }
        - { name: provider, in: query, schema: { type: string, enum: [vnpay, momo, zalopay, mock] } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: 'Order + user_id + user_email (v1.1 – S10, chỉ admin) + payments[].provider_txn_id/merchant_ref', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/billing/summary:
    get:
      tags: [Admin]
      summary: Doanh thu theo ngày × cổng, đơn theo trạng thái, đơn kẹt (v1.1 – S7)
      parameters: [ { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { by_day: { type: array, items: { type: object } }, orders_by_status: { type: object }, stuck_pending: { type: integer }, revenue_total: { type: number } } } } } }
  /admin/billing/reconciliations:
    get:
      tags: [Admin]
      summary: Các lần đối soát (v1.1 – S7)
      parameters: [ { name: provider, in: query, schema: { type: string, enum: [vnpay, momo, zalopay, mock] } }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReconciliationRun' } } } } }
    post:
      tags: [Admin]
      summary: Đối soát một cổng × ngày với sao kê CSV hoặc queryStatus (v1.1 – S7)
      description: 'CSV theo mẫu `docs/runbooks/payments.md` gửi trong JSON `{ csv }` (multipart: S8). UNIQUE (provider, for_date) – chạy lại ghi đè. Job `billing.reconcile` chạy hằng ngày 01:30 giờ VN (queryStatus, không ghi đè lần chạy đã có).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [provider], properties: { provider: { type: string, enum: [vnpay, momo, zalopay, mock] }, for_date: { type: string, format: date }, source: { type: string, enum: [csv, query], default: csv }, csv: { type: string } } } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationRun' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /admin/billing/reconciliations/{runId}:
    get:
      tags: [Admin]
      summary: Báo cáo một lần đối soát; `format=csv` → tải danh sách lệch (v1.1 – S7)
      parameters: [ { name: runId, in: path, required: true, schema: { type: string, format: uuid } }, { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationRun' } }, text/csv: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/billing/jobs/{job}:
    post:
      tags: [Admin]
      summary: Chạy ngay một job billing (v1.1 – S7)
      description: 'order.expire | payment.reconcile | subscription.expire | credit.grant_monthly | credit.expire | billing.reconcile | credit.grant_free_monthly (S8: Free 300 credit/tháng) | invoice.retry (S8: thử lại hoá đơn theo backoff). Chạy inline xong trong 10 s → 200 kèm kết quả; đưa vào hàng đợi → 202. v1.1 – S10: body tuỳ chọn `min_age_minutes` (0–1440) cho payment.reconcile – bỏ ngưỡng PAYMENT_RECONCILE_AFTER_MINUTES (0 = mọi lần thanh toán initiated ≤ 48 giờ); job khác bỏ qua.'
      parameters: [ { name: job, in: path, required: true, schema: { type: string, enum: [order.expire, payment.reconcile, subscription.expire, credit.grant_monthly, credit.expire, billing.reconcile, credit.grant_free_monthly, invoice.retry] } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { min_age_minutes: { type: integer, minimum: 0, maximum: 1440 } } }
      responses:
        '200': { description: Đã chạy xong, content: { application/json: { schema: { type: object, properties: { job: { type: string }, job_id: { type: string }, mode: { type: string }, status: { type: string }, result: { type: object } } } } } }
        '202': { description: Đã đưa vào hàng đợi, content: { application/json: { schema: { type: object, properties: { job: { type: string }, job_id: { type: string }, mode: { type: string }, status: { type: string } } } } } }
  /admin/billing/payments:
    get:
      tags: [Admin]
      summary: Danh sách thanh toán có lọc (v1.1 – S8)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [initiated, success, failed, refunded] } }
        - { name: provider, in: query, schema: { type: string, enum: [vnpay, momo, zalopay, mock] } }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminPayment' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/billing/invoices:
    get:
      tags: [Admin]
      summary: Danh sách hoá đơn điện tử có lọc (v1.1 – S8)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, issued, error, failed, cancel_pending, cancelled, skipped] } }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminInvoice' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/billing/invoices/reconciliation:
    get:
      tags: [Admin]
      summary: Đối chiếu hoá đơn tháng – hoá đơn hiệu lực = đơn paid − refunded (theo paid_at, giờ VN) (v1.1 – S8)
      parameters: [ { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-11' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceReconciliation' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /admin/billing/subscriptions:
    get:
      tags: [Admin]
      summary: Danh sách subscription có lọc (v1.1 – S8)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [trialing, active, past_due, cancelled, expired, lifetime] } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: plan_code, in: query, schema: { type: string } }
        - { name: program, in: query, schema: { type: string, enum: [toeic, ielts, jlpt, hsk] } }
        - { name: expiring_within_days, in: query, schema: { type: integer, minimum: 1, maximum: 365 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: 'Subscription + user_id, user_email (v1.1 – S10), created_at', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Subscription' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/billing/dead-letters:
    get:
      tags: [Admin]
      summary: Dead-letter job hoá đơn (invoice.issue | invoice.cancel) – ops.jobs_deadletter (v1.1 – S8)
      parameters:
        - { name: job, in: query, schema: { type: string, enum: [invoice.issue, invoice.cancel] } }
        - { name: include_resolved, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/DeadLetter' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/billing/dead-letters/{deadLetterId}/retry:
    post:
      tags: [Admin]
      summary: Thử lại job hoá đơn trong dead-letter (đặt lại số lần thử, audit) (v1.1 – S8)
      description: 'Chạy inline xong trong 10 s → `outcome` (status issued | error | failed …); hàng đợi → `outcome = null`, `mode = queued`. Đã xử lý → 409 `already_resolved`.'
      parameters: [ { name: deadLetterId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { dead_letter: { $ref: '#/components/schemas/DeadLetter' }, outcome: { type: [object, 'null'] }, mode: { type: string, enum: [inline, queued] } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/promotions:
    get:
      tags: [Admin]
      summary: Danh sách khuyến mãi + thống kê lượt (v1.1 – S8)
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: kind, in: query, schema: { type: string, enum: [percent, fixed, credit_bonus, trial_days] } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PromotionAdmin' } }, next_cursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [Admin]
      summary: Tạo khuyến mãi (audit promotion.create) (v1.1 – S8)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromotionInput' } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromotionAdmin' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/promotions/{promotionId}:
    get:
      tags: [Admin]
      summary: Chi tiết khuyến mãi (v1.1 – S8)
      parameters: [ { name: promotionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromotionAdmin' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Admin]
      summary: Sửa khuyến mãi – mã không đổi được (audit promotion.update) (v1.1 – S8)
      parameters: [ { name: promotionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromotionPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromotionAdmin' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/plans:
    put:
      tags: [Admin]
      summary: Cập nhật gói/giá/quota/bảng credit (không cần deploy)
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: OK } }
  /admin/flags:
    get:
      tags: [Admin]
      summary: Danh sách feature flag (v1.1 – S11)
      description: 'Vai trò admin. Mỗi cờ: `key`, `enabled`, `rules`, `updated_at`, `public` (có trong GET /flags).'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/FeatureFlag' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /admin/flags/{key}:
    get:
      tags: [Admin]
      summary: Một feature flag (v1.1 – S11)
      parameters: [ { name: key, in: path, required: true, schema: { type: string, pattern: '^ff\.[a-z0-9_]+(\.[a-z0-9_]+)+$' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlag' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Admin]
      summary: Bật/tắt feature flag theo quy tắc
      description: 'v1.1 – S11: ghi DB + audit, xoá cache Redis và phát `ff:invalidate` (pub/sub) → kill-switch có hiệu lực < 60 s trên mọi replica (thường < 1 s). v1.1 – S7: `rules = {percent, user_ids[], plan_kinds[], programs[]}`; cờ tắt vẫn bật cho `user_ids` (tester). Audit `flag.update`. S7 dùng `ff.billing.checkout`. v1.1 – S8: `rules.config` – cấu hình tính năng (`ff.growth.referral`: `{rewards: {started: {referrer, referee}, upgraded: {…}}, monthly_cap, abuse_window_hours, require_verified_email}`).'
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, rules: { type: object } } } } } }
      responses: { '200': { description: OK } }
  /admin/users/{userId}/credits:
    post:
      tags: [Admin]
      summary: Cấp/điều chỉnh credit thủ công (ghi audit)
      description: 'v1.1 – S8: ledger reason `admin_adjust` (ref_type `admin`, ref_id = admin), `note` = lý do bắt buộc (3–500 ký tự), audit `user.grant_credits` có admin id; `delta` âm làm số dư < 0 → 409 `insufficient_balance`; `expires_at` (tuỳ chọn, delta > 0) → lô có hạn. Người dùng không tồn tại → 404.'
      parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [delta, note], properties: { delta: { type: integer }, note: { type: string, minLength: 3, maxLength: 500 }, expires_at: { type: string, format: date-time, description: v1.1 – S8 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminCreditAdjustResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/credits/ledger:
    get:
      tags: [Admin]
      summary: Số dư + ledger credit của người dùng (cursor id giảm dần) (v1.1 – S8)
      parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { user_id: { type: string, format: uuid }, balance: { type: integer }, data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }, next_cursor: { type: [string, 'null'] } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/notifications/test:
    post:
      tags: [Admin]
      summary: Gửi thử thông báo đẩy "Đến giờ học" tới các thiết bị của một người dùng (v1.1 – S6)
      description: |
        Vai trò admin. Mặc định gửi cho chính admin. Ghi `ops.notifications` (channel push, template_code), gửi tới mọi
        `ops.push_subscriptions` của người nhận; endpoint trả 404/410 → xoá đăng ký. Người nhận tắt `channels.push` → `skipped`
        trừ khi `force = true`. Payload = PushPayload (`title`/`body` null → service worker dịch theo `template_code`). Lịch tự động ở S9.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTestNotificationInput' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTestNotificationResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/reports/ai-costs:
    get:
      tags: [Admin]
      summary: Chi phí AI theo ngày/tác vụ/model, credit tiêu, cache hit, chất lượng eval
      description: 'v1.1 – Sprint 5: `from`/`to` là ngày lịch Asia/Ho_Chi_Minh (mặc định 30 ngày); tổng `cost_usd` = tổng ai_tasks.cost_usd (cùng giá trị gửi Langfuse `usage.totalCost`).'
      parameters: [ { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AiCostReport' } } } } }

  # ---------------------------------------------------------------- v1.1 – S12: beta kín, phản hồi, hỗ trợ, NPS, pháp lý, MFA
  /waitlist:
    post:
      tags: [Growth]
      security: []
      summary: Đăng ký danh sách chờ (landing) – luôn 202, không lộ email đã tồn tại (v1.1 – S12)
      description: 'Công khai, giới hạn theo IP (bucket `waitlist_ip`, 429 `rate_limited`). Trùng (email, program) → cập nhật locale/đồng ý marketing (chỉ khi còn `waiting`), vẫn 202 cùng body. Email không ghi log; IP chỉ lưu sha256 có muối. Outbox `waitlist.joined` (không email).'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistInput' } } } }
      responses:
        '202': { description: Đã tiếp nhận, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [accepted] } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /beta/status:
    get:
      tags: [Growth]
      summary: Trạng thái beta kín của người gọi (ẩn danh hoặc đăng nhập) (v1.1 – S12)
      description: '`gate_enabled` = `ff.growth.beta_gate.enabled`. Đăng nhập → `has_access` (vai trò nội bộ/beta_tester, mã đã đổi, hoặc `rules.user_ids` allowlist) + `reason`. Không bị chặn bởi beta gate.'
      security: [{}, bearerAuth: [], cookieAuth: []]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BetaStatus' } } } }
  /beta/redeem:
    post:
      tags: [Growth]
      summary: Đổi mã mời beta → Pro dùng thử 60 ngày + 2.000 credit (v1.1 – S12)
      description: |
        Mã đơn dùng một lần (`ALG-XXXX-XXXX`, không phân biệt hoa thường/dấu gạch). Một transaction: subscription `trialing` gói
        `<program>_pro_monthly` (bỏ qua khi đã có Pro còn hạn → `trial_skipped = already_pro`), lô credit ledger `promo`
        (`ref_type = beta_invite`, hạn `credit_valid_days`), vai trò `beta_tester`, audit `beta.redeemed`, outbox `beta.redeemed`.
        Idempotent: cùng người đổi lại cùng mã → 200 `already_redeemed` (không cấp lần 2). Mã sai/hết hạn/thu hồi → 400
        `validation_failed` `details.reason = invite_invalid`; mã đã được người khác dùng → 409 `conflict` `details.reason = invite_used`;
        người dùng đã đổi mã khác → 409 `details.reason = already_beta`. Khách (guest) → 403. Bucket `beta_redeem` (10/10′/người).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, minLength: 6, maxLength: 64 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BetaRedeemResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /me/beta-survey:
    post:
      tags: [Me]
      summary: Khảo sát onboarding beta 5 câu (mục tiêu, ngày thi, điểm hiện tại, thiết bị, thời gian học) (v1.1 – S12)
      description: 'Ghi `ops.survey_responses` (kind `beta_onboarding`, answers JSONB) – gửi lại ghi đè (upsert). Outbox `survey.submitted`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BetaSurveyInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SurveyResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /me/surveys/pending:
    get:
      tags: [Me]
      summary: Khảo sát in-app đang chờ (onboarding beta, NPS ngày 7 và 14) (v1.1 – S12)
      description: 'Mốc tính từ lúc đổi mã beta (hoặc ngày đăng ký): `nps_d7` hiển thị ngày 7–13, `nps_d14` ngày 14–27; `beta_onboarding` khi là beta tester chưa trả lời. Đã trả lời → không còn trong danh sách.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PendingSurveys' } } } }
  /me/surveys/nps:
    post:
      tags: [Me]
      summary: Trả lời NPS (0–10 + nhận xét) (v1.1 – S12)
      description: '`survey` mặc định = NPS đang chờ. Đã trả lời loại này → 200 trả bản đã lưu (idempotent, không ghi đè). Chưa tới hạn / không có NPS chờ → 409 `conflict` `details.reason = not_due`.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [score], properties: { score: { type: integer, minimum: 0, maximum: 10 }, comment: { type: string, maxLength: 2000 }, survey: { type: string, enum: [nps_d7, nps_d14] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SurveyResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /feedback:
    post:
      tags: [Growth]
      summary: Góp ý in-app (kèm ảnh màn hình + trace_id tự động) → ops.feedback (v1.1 – S12)
      description: |
        Ảnh: `POST /uploads/presign {kind: image}` → PUT → gửi `screenshot_upload_id` (phải là ảnh của chính người gọi, bucket riêng tư
        recordings; admin xem bằng URL ký 10 phút). `trace_id` thiếu → server gắn trace của chính request (luôn trả về `trace_id`).
        Ngữ cảnh lưu: trang, user agent rút gọn, app_version, locale – không lưu email/IP. Bucket `feedback` (10/10′/người).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackCreated' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /content-reports:
    post:
      tags: [Catalog]
      summary: Báo lỗi câu hỏi → ops.content_reports + hàng đợi duyệt CMS (SLA 48 giờ) (v1.1 – S12)
      description: 'Theo `question_version_id` (phiên bản người học đã làm). Mỗi người một báo cáo mở cho mỗi phiên bản: gửi lại → 201 với báo cáo cũ (`duplicate = true`). Được phép cả khi đang thi (không lộ đáp án). Bucket `feedback`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentReportInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ContentReportCreated' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /support/tickets:
    post:
      tags: [Growth]
      summary: Tạo ticket hỗ trợ (SLA phản hồi đầu 24 giờ) (v1.1 – S12)
      description: 'Không bị chặn bởi beta gate (người chưa vào được app vẫn gửi được). `context` lưu trace_id/attempt_id/page. Outbox `support_ticket.created`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupportTicketInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SupportTicket' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /me/support/tickets:
    get:
      tags: [Me]
      summary: Ticket hỗ trợ của tôi (cursor, mới nhất trước) (v1.1 – S12)
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/SupportTicket' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /me/support/tickets/{ticketId}:
    get:
      tags: [Me]
      summary: Chi tiết ticket kèm hội thoại (v1.1 – S12)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SupportTicket' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /support/tickets/{ticketId}/messages:
    post:
      tags: [Growth]
      summary: Người học trả lời ticket (2 chiều) – ticket đã giải quyết được mở lại (v1.1 – S12)
      description: 'Chỉ chủ ticket (khác → 404). `closed` → 409 `conflict` `details.reason = ticket_closed`; `resolved`/`waiting_user` → `open`.'
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string, minLength: 1, maxLength: 8000 } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SupportTicket' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /legal/policies:
    get:
      tags: [Me]
      security: []
      summary: Phiên bản các văn bản pháp lý (điều khoản, riêng tư, hoàn tiền, đồng ý giọng nói) (v1.1 – S12)
      description: 'Nội dung là PLACEHOLDER chờ luật sư duyệt (`status = draft_pending_legal_review`). `voice_consent` ghi đồng ý loại `voice_processing` (POST /me/consents) – chuẩn bị GĐ2; `refund_policy` là loại đồng ý mới (tuỳ chọn, ghi nhận khi thanh toán).'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Policies' } } } }
  /me/mfa:
    get:
      tags: [Me]
      summary: Trạng thái MFA TOTP của tôi (v1.1 – S12)
      description: '`required` = có vai trò admin/superadmin và `ADMIN_MFA_REQUIRED`; `session_verified` = phiên hiện tại đã step-up.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MfaStatus' } } } }
  /auth/mfa/totp/enroll:
    post:
      tags: [Auth]
      summary: Bắt đầu đăng ký TOTP (RFC 6238, SHA1, 6 số, 30 giây) – trả secret base32 + otpauth URL (v1.1 – S12)
      description: 'Đã có TOTP đã xác nhận → 409 `conflict` `details.reason = mfa_already_enrolled`. Gọi lại khi chưa xác nhận → secret mới.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollResult' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /auth/mfa/totp/confirm:
    post:
      tags: [Auth]
      summary: Xác nhận TOTP bằng mã đầu tiên → 10 mã khôi phục (hiển thị MỘT lần) + token phiên đã xác minh (v1.1 – S12)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^\d{6}$' } } } } } }
      responses:
        '200': { description: 'OK – kèm cookie/token mới (claim mfa)', content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/MfaTokens' }, { type: object, properties: { recovery_codes: { type: array, items: { type: string } } } } ] } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Step-up MFA cho phiên hiện tại bằng mã TOTP hoặc mã khôi phục → token mới có claim mfa (v1.1 – S12)
      description: 'Sai → 400 `validation_failed` `details.reason = mfa_invalid`; 5 lần sai/15′ → 429 `rate_limited` `details.reason = mfa_locked`. Mã TOTP đã dùng (cùng bước 30 s) bị từ chối (chống replay). Mã khôi phục dùng một lần.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string, pattern: '^\d{6}$' }, recovery_code: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MfaTokens' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/mfa/recovery-codes:
    post:
      tags: [Auth]
      summary: Tạo lại 10 mã khôi phục (cần mã TOTP hiện tại; mã cũ vô hiệu) (v1.1 – S12)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^\d{6}$' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { recovery_codes: { type: array, items: { type: string } } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- v1.1 – S12: Admin beta, phản hồi, hỗ trợ
  /admin/beta/waitlist:
    get:
      tags: [Admin]
      summary: Danh sách chờ (lọc chương trình/trạng thái; email che) (v1.1 – S12)
      parameters: [ { name: program, in: query, schema: { type: string, enum: [toeic, ielts, jlpt, hsk] } }, { name: status, in: query, schema: { type: string, enum: [waiting, invited, joined, removed] } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminWaitlistEntry' } }, next_cursor: { type: [string, 'null'] }, counts: { type: object, additionalProperties: { type: integer } } } } } } }
  /admin/beta/invites:
    get:
      tags: [Admin]
      summary: Lời mời beta (lọc trạng thái/đợt) + hạn mức gửi hôm nay (v1.1 – S12)
      parameters: [ { name: status, in: query, schema: { type: string, enum: [queued, sent, redeemed, revoked, expired, failed] } }, { name: batch, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminBetaInvite' } }, next_cursor: { type: [string, 'null'] }, today: { type: object, properties: { sent: { type: integer }, limit: { type: integer }, remaining: { type: integer } } }, counts: { type: object, additionalProperties: { type: integer } } } } } } }
    post:
      tags: [Admin]
      summary: Chọn người từ danh sách chờ (hoặc email) → xếp hàng mời (gửi theo đợt bởi job beta.invites_send) (v1.1 – S12)
      description: 'Email đã có lời mời còn hiệu lực (queued/sent/redeemed) → bỏ qua (`skipped`). Audit `beta.invites_created`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminBetaInviteCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { queued: { type: integer }, skipped: { type: integer }, batch: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /admin/beta/invites/send:
    post:
      tags: [Admin]
      summary: Chạy ngay job gửi mời theo đợt (tôn trọng hạn mức/ngày) (v1.1 – S12)
      requestBody: { content: { application/json: { schema: { type: object, properties: { limit: { type: integer, minimum: 1, maximum: 500 } } } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { job_id: { type: string }, mode: { type: string, enum: [queued, inline] }, result: { type: [object, 'null'] } } } } } }
  /admin/beta/invites/{inviteId}/revoke:
    post:
      tags: [Admin]
      summary: Thu hồi lời mời chưa dùng (v1.1 – S12)
      parameters: [ { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminBetaInvite' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/feedback:
    get:
      tags: [Admin]
      summary: Góp ý in-app (lọc trạng thái/loại) – ảnh màn hình URL ký 10 phút (v1.1 – S12)
      parameters: [ { name: status, in: query, schema: { type: string, enum: [new, triaged, done, wontfix] } }, { name: category, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminFeedbackItem' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/feedback/{feedbackId}:
    patch:
      tags: [Admin]
      summary: Đổi trạng thái góp ý (audit feedback.update) (v1.1 – S12)
      parameters: [ { name: feedbackId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [new, triaged, done, wontfix] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminFeedbackItem' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/content/reports:
    get:
      tags: [Admin]
      summary: Hàng đợi báo lỗi câu (SLA 48 giờ, `overdue`) – cùng dữ liệu CMS đồng bộ (v1.1 – S12)
      parameters: [ { name: status, in: query, schema: { type: string, enum: [open, confirmed, rejected, fixed] } }, { name: overdue, in: query, schema: { type: boolean } }, { name: question_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ContentReportItem' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/content/reports/{reportId}:
    patch:
      tags: [Admin]
      summary: Xử lý báo lỗi câu (confirmed/rejected/fixed + ghi chú) – người báo nhận thông báo in-app (v1.1 – S12)
      parameters: [ { name: reportId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentReportStatusInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentReportItem' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/support/tickets:
    get:
      tags: [Admin]
      summary: Ticket hỗ trợ (lọc trạng thái/ưu tiên/loại/quá hạn SLA/người dùng/từ khoá tiêu đề) (v1.1 – S12)
      parameters: [ { name: status, in: query, schema: { type: string, enum: [open, waiting_user, resolved, closed] } }, { name: priority, in: query, schema: { type: string, enum: [low, normal, high, urgent] } }, { name: category, in: query, schema: { type: string } }, { name: overdue, in: query, schema: { type: boolean } }, { name: user_id, in: query, schema: { type: string, format: uuid } }, { name: q, in: query, schema: { type: string, maxLength: 100 } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminSupportTicket' } }, next_cursor: { type: [string, 'null'] }, counts: { type: object, additionalProperties: { type: integer } } } } } } }
  /admin/support/tickets/{ticketId}:
    get:
      tags: [Admin]
      summary: Chi tiết ticket + hội thoại + tóm tắt người dùng (PII che) (v1.1 – S12)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportTicket' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Admin]
      summary: Đổi trạng thái/ưu tiên/người phụ trách (v1.1 – S12)
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [open, waiting_user, resolved, closed] }, priority: { type: string, enum: [low, normal, high, urgent] }, assigned_to: { type: [string, 'null'], format: uuid } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportTicket' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/support/tickets/{ticketId}/messages:
    post:
      tags: [Admin]
      summary: Trả lời ticket (email/in-app qua NotificationService) + tuỳ chọn cấp credit bù (v1.1 – S12)
      description: 'Ghi mốc phản hồi đầu (SLA). `credit` → CreditService.adjust (ledger `admin_adjust`, ref admin) trong cùng transaction + audit `user.grant_credits`; thông báo template `support.reply` (inapp + email, transactional). Audit `support.reply`.'
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportReply' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/AdminSupportTicket' }, { type: object, properties: { delivery: { type: array, items: { type: object } }, credit: { type: [object, 'null'] } } } ] } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- v1.1 – S12: Admin tổng hợp
  /admin/users:
    get:
      tags: [Admin]
      summary: Tìm người dùng theo email (chính xác/tiền tố), tên (chứa) hoặc id (v1.1 – S12)
      description: 'Kết quả che PII (`email_masked`, không phone). Ghi audit `admin.user_search` (không ghi chuỗi tìm kiếm).'
      parameters: [ { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 120 } }, { name: status, in: query, schema: { type: string, enum: [active, suspended, pending_deletion, deleted] } }, { name: role, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminUserSummary' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/users/{userId}:
    get:
      tags: [Admin]
      summary: Hồ sơ người dùng (PII che) + lịch sử attempt/đơn/ticket, gói, credit, beta, phiên (v1.1 – S12)
      parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/lock:
    post:
      tags: [Admin]
      summary: Khoá tài khoản → status suspended + thu hồi mọi phiên (denylist, hiệu lực ngay, ≤ 60 s) (v1.1 – S12)
      description: 'Không khoá chính mình; khoá admin/superadmin cần superadmin (403). Audit `user.locked` (lý do), outbox `user.locked`.'
      parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { user_id: { type: string, format: uuid }, status: { type: string }, sessions_revoked: { type: integer } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/unlock:
    post:
      tags: [Admin]
      summary: Mở khoá tài khoản (v1.1 – S12)
      parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { user_id: { type: string, format: uuid }, status: { type: string } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/deletion:
    post:
      tags: [Admin]
      summary: Xoá dữ liệu theo yêu cầu người dùng (DeletionService – hoàn tất ≤ 72 giờ) (v1.1 – S12)
      parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [scheduled] }, due_at: { type: string, format: date-time }, request_id: { type: string, format: uuid } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/impersonate:
    post:
      tags: [Admin]
      summary: Xem như người dùng – token CHỈ ĐỌC 10 phút, mọi request ghi audit (v1.1 – S12)
      description: |
        Bearer token (không cookie, không refresh) với claim `scope = read_only`, `imp = <admin id>`: chỉ GET/HEAD; POST/PUT/PATCH/DELETE
        → 403 `forbidden` `details.reason = impersonation_read_only`; endpoint /admin/* → 403. Mỗi request ghi audit
        `impersonation.request` (admin, người dùng, method, route). Không impersonate admin/superadmin/chính mình (403). Bắt đầu: audit
        `user.impersonation_started`. Khoá tài khoản → token bị thu hồi.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdminImpersonation' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/content/questions/stats:
    get:
      tags: [Admin]
      summary: Thống kê câu hỏi (p-value, point-biserial, thời gian TB, số báo lỗi, đề xuất retire/review) (v1.1 – S12)
      description: 'Đọc `catalog.questions.stats` (job `content.stats_nightly`). `recommendation`: retire (phân biệt âm/rất thấp hoặc ≥ 5 báo lỗi xác nhận), review (quá khó < 0,2 / quá dễ > 0,95 / phân biệt < 0,2 / ≥ 3 báo lỗi mở), ok, insufficient_data (n < min_n).'
      parameters: [ { name: program, in: query, schema: { type: string, enum: [toeic, ielts, jlpt, hsk] } }, { name: section, in: query, schema: { type: string } }, { name: recommendation, in: query, schema: { type: string, enum: [retire, review, ok, insufficient_data] } }, { name: sort, in: query, schema: { type: string, enum: [p_value, discrimination, reports, n, avg_time] } }, { name: min_n, in: query, schema: { type: integer, minimum: 0 } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/QuestionStats' } }, next_cursor: { type: [string, 'null'] }, computed_at: { type: [string, 'null'] } } } } } }
  /admin/content/questions/stats/recompute:
    post:
      tags: [Admin]
      summary: Chạy ngay content.stats_nightly (v1.1 – S12)
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { job_id: { type: string }, mode: { type: string }, result: { type: [object, 'null'] } } } } } }
  /admin/ai/quality:
    get:
      tags: [Admin]
      summary: Chất lượng AI theo phiên bản prompt – số tác vụ, 👍/👎 (helpful vs not_helpful|wrong), tỉ lệ, refused, chi phí (v1.1 – S12)
      parameters: [ { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { name: task_code, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { from: { type: string }, to: { type: string }, data: { type: array, items: { $ref: '#/components/schemas/AiQualityRow' } } } } } } }
  /admin/ai/refusals:
    get:
      tags: [Admin]
      summary: Mẫu tác vụ bị guardrail từ chối (lý do, task, input_ref – không nội dung người học) (v1.1 – S12)
      parameters: [ { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object } }, next_cursor: { type: [string, 'null'] }, by_reason: { type: object, additionalProperties: { type: integer } } } } } } }
  /admin/system/status:
    get:
      tags: [Admin]
      summary: Hệ thống – độ sâu hàng đợi BullMQ, dead-letter, độ phủ partition, cờ, SLA hỗ trợ (v1.1 – S12)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSystemStatus' } } } }
  /admin/jobs/dead-letters:
    get:
      tags: [Admin]
      summary: Dead-letter mọi hàng đợi (lọc queue/job, đã replay) (v1.1 – S12)
      parameters: [ { name: queue, in: query, schema: { type: string } }, { name: job, in: query, schema: { type: string } }, { name: replayed, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/DeadLetterItem' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /admin/jobs/dead-letters/{deadLetterId}/replay:
    post:
      tags: [Admin]
      summary: Replay job dead-letter (xoá job thất bại cũ trong BullMQ rồi thêm lại cùng jobId; Redis/worker không sẵn → chạy inline) (v1.1 – S12)
      description: 'Job không có handler → 409 `conflict` `details.reason = no_handler`. Audit `job.dead_letter_replayed`; `replay_count + 1`.'
      parameters: [ { name: deadLetterId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/DeadLetterItem' }, { type: object, properties: { mode: { type: string, enum: [queued, inline] }, result: { type: [object, 'null'] }, error: { type: [string, 'null'] } } } ] } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Tìm nhật ký kiểm toán (actor, action – tiền tố khi kết thúc bằng `.`/`*`, entity, khoảng thời gian; mặc định 30 ngày) (v1.1 – S12)
      parameters: [ { name: actor, in: query, schema: { type: string, format: uuid } }, { name: action, in: query, schema: { type: string, maxLength: 100 } }, { name: entity_type, in: query, schema: { type: string } }, { name: entity_id, in: query, schema: { type: string, format: uuid } }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditLogItem' } }, next_cursor: { type: [string, 'null'] } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /admin/reports/beta:
    get:
      tags: [Admin]
      summary: KPI beta tuần (activation, D1/D7/D14, phiên/tuần, câu/người, explain/người, 👍, NPS, ý định mua) – JSON + Markdown (v1.1 – S12)
      description: 'Cùng nguồn với `pnpm report:beta` (replica). `week` ISO (YYYY-Www, giờ VN), mặc định tuần trước. PostHog chưa cấu hình → `posthog = null` ("chưa có").'
      parameters: [ { name: week, in: query, schema: { type: string, pattern: '^\d{4}-W\d{2}$' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { week: { type: string }, kpis: { type: object }, posthog: { type: [object, 'null'] }, markdown: { type: string } } } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cookieAuth: { type: apiKey, in: cookie, name: allingo_at }
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    ProgramPath: { name: program, in: path, required: true, schema: { type: string, enum: [toeic, ielts, jlpt, hsk] } }
    ProgramQuery: { name: program, in: query, required: true, schema: { type: string, enum: [toeic, ielts, jlpt, hsk] } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    TestSetId: { name: testSetId, in: path, required: true, schema: { type: string, format: uuid } }
    LessonId: { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
    VideoId: { name: videoId, in: path, required: true, schema: { type: string, format: uuid } }
