openapi: 3.1.0
info:
  title: Allingo API
  version: 1.0.0-draft
  summary: API nền tảng luyện thi AI Allingo (TOEIC · IELTS · JLPT · HSK)
  description: |
    Đặc tả REST API v1 cho web/PWA, mobile và Payload CMS.

    **Quy ước chung**
    - Base URL: `https://api.allingo.vn/v1`. Mọi response JSON, UTF-8.
    - Xác thực: `Authorization: Bearer <access_jwt>` (mobile) hoặc cookie httpOnly `allingo_at` (web). Access token 15 phút, refresh xoay vòng.
    - Ngôn ngữ: header `Accept-Language` (vi|en|ja|ko|th) quyết định nội dung i18n; ghi đè bằng `?locale=`.
    - Lỗi: envelope `{ "error": { "code", "message", "details", "trace_id" } }` với HTTP 4xx/5xx (schema `Error`).
    - Phân trang: cursor (`?cursor=&limit=` ≤ 100) → `{ "data": [], "next_cursor": "..." | null }`.
    - Idempotency: POST tạo đơn hàng / submission / order dùng header `Idempotency-Key` (UUID), hiệu lực 24 giờ.
    - Rate limit: header `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `Retry-After`.
    - Quota/credit: 429 `quota_exceeded` (kèm `details.feature`, `details.reset_at`, `details.quota` = QuotaExceededDetails – v1.1) / 402 `insufficient_credits`.
    - Realtime: WebSocket `wss://api.allingo.vn/v1/ws` (Socket.IO), sự kiện `submission.graded`, `plan.updated`, `credits.changed`, `notification.new`.
    - Streaming AI: `text/event-stream` cho chat và giải thích (`event: delta|done|error`).
  contact:
    name: Allingo Engineering
servers:
  - url: https://api.allingo.vn/v1
    description: Production
  - url: https://api.stg.allingo.vn/v1
    description: Staging
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Auth
    description: "Đăng ký, đăng nhập, OAuth, OTP, phiên"
  - name: Me
    description: "Hồ sơ, mục tiêu, enrollment, đồng ý, xoá dữ liệu"
  - name: Catalog
    description: "Chương trình, đề, bài học, video, từ vựng, tra từ"
  - name: Attempts
    description: "Làm bài, lưu nháp, nộp, xem lại, luyện theo Part"
  - name: AI
    description: "Giải thích, gia sư chat/voice, realtime token, phản hồi"
  - name: Grading
    description: "Submission Writing/Speaking, kết quả, làm lại, Impromptu"
  - name: Speech
    description: "Shadowing, chấm phát âm, dịch video, tách câu"
  - name: Learning
    description: "Lộ trình, diagnostic, SRS, nhật ký lỗi, thống kê, dự báo"
  - name: Billing
    description: "Gói, đơn hàng, thanh toán, subscription, credit, hoá đơn"
  - name: Growth
    description: "Thông báo, referral, tích hợp lịch"
  - name: B2B
    description: "Tổ chức, lớp, giao bài, báo cáo"
  - name: Admin
    description: "CMS/vận hành: nội dung, prompt, eval, gói, quota, flag"
  - name: Webhooks
    description: "Callback từ cổng thanh toán"

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Đăng ký bằng email/mật khẩu (ghép tài khoản khách nếu có guest_token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                display_name: { type: string }
                guest_token: { type: string, description: Token phiên khách để ghép tiến độ }
                referral_code: { type: string }
                ui_locale: { type: string, default: vi }
                accept_terms: { type: boolean, description: 'Đồng ý điều khoản + chính sách (PDPL); false → 400. v1.1' }
                marketing_opt_in: { type: boolean }
                turnstile_token: { type: string, description: Cloudflare Turnstile (bắt buộc khi máy chủ bật) }
      responses:
        '201': { $ref: '#/components/responses/AuthTokens' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Đăng nhập email/mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                guest_token: { type: string }
                turnstile_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthTokens' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/oauth/{provider}:
    post:
      tags: [Auth]
      security: []
      summary: Đăng nhập/đăng ký qua Google, Apple, Facebook (id_token hoặc code)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, apple, facebook] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
                nonce: { type: string }
                guest_token: { type: string }
                referral_code: { type: string }
                ui_locale: { type: string }
                display_name: { type: string, description: Apple chỉ gửi tên ở lần đầu – client chuyển tiếp }
                link_password: { type: string, description: 'Khi email đã có tài khoản mật khẩu: xác nhận liên kết (409 link_required nếu thiếu)' }
                link_confirm: { type: boolean, description: 'Khi email đã có tài khoản không mật khẩu: xác nhận liên kết' }
      responses:
        '200': { $ref: '#/components/responses/AuthTokens' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Gửi OTP qua Zalo ZNS, SMS hoặc email (đúng một trong phone | email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, example: '+84901234567' }
                email: { type: string, format: email }
                channel: { type: string, enum: [zalo, sms, email], description: 'Mặc định zalo cho phone, email cho email' }
                turnstile_token: { type: string }
      responses:
        '202':
          description: 'Đã gửi; `retry_after` giây trước khi gửi lại'
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, enum: [sent] }, channel: { type: string }, retry_after: { type: integer }, expires_in: { type: integer } } }
        '429': { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Xác minh OTP → đăng nhập/đăng ký
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                phone: { type: string }
                email: { type: string, format: email }
                otp: { type: string, minLength: 6, maxLength: 6 }
                guest_token: { type: string }
                display_name: { type: string, description: Dùng khi tạo tài khoản mới }
                ui_locale: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthTokens' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/guest:
    post:
      tags: [Auth]
      security: []
      summary: Tạo phiên khách để luyện không cần đăng ký
      responses:
        '201':
          description: Guest token
          content:
            application/json:
              schema: { type: object, properties: { guest_token: { type: string }, expires_at: { type: string, format: date-time } } }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Cấp lại access token bằng refresh token (cookie hoặc body)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { refresh_token: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/AuthTokens' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Thu hồi phiên hiện tại
      responses:
        '204': { description: Đã đăng xuất }

  # ---------------------------------------------------------------- Me
  /me:
    get:
      tags: [Me]
      summary: Hồ sơ người dùng hiện tại
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      tags: [Me]
      summary: Cập nhật hồ sơ (tên, ảnh, ngôn ngữ, múi giờ)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    delete:
      tags: [Me]
      summary: Yêu cầu xoá tài khoản & dữ liệu (hoàn tất ≤ 72 giờ, PDPL)
      responses:
        '202':
          description: 'Đã tiếp nhận; mọi phiên bị thu hồi ngay'
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, enum: [scheduled] }, due_at: { type: string, format: date-time }, request_id: { type: string, format: uuid } } }
        '409': { $ref: '#/components/responses/Error' }
  /me/sessions:
    get:
      tags: [Me]
      summary: Danh sách phiên đang hoạt động
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Session' } } } } }
  /me/sessions/{sessionId}:
    delete:
      tags: [Me]
      summary: Thu hồi một phiên (đăng xuất từ xa)
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses: { '204': { description: Đã thu hồi } }
  /me/consents:
    get:
      tags: [Me]
      summary: Các đồng ý đã cấp (điều khoản, xử lý giọng nói, marketing)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Consent' } } } } }
    post:
      tags: [Me]
      summary: Cấp/thu hồi đồng ý
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, granted]
              properties:
                type: { type: string, enum: [terms, privacy, voice_processing, marketing, minor_guardian] }
                granted: { type: boolean }
                version: { type: string }
      responses: { '200': { description: OK } }
  /me/enrollments:
    get:
      tags: [Me]
      summary: Các chương trình đang học & mục tiêu
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Enrollment' } } } } }
    post:
      tags: [Me]
      summary: Bắt đầu một chương trình (mục tiêu, ngày thi, phút/ngày)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentInput' }
      responses:
        '201': { description: 'Đã tạo, kèm `diagnostic_attempt_id` để làm bài đầu vào', content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } } }
  /me/enrollments/{program}:
    patch:
      tags: [Me]
      summary: Đổi mục tiêu/ngày thi/phút học → lộ trình tính lại
      parameters: [ { $ref: '#/components/parameters/ProgramPath' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentInput' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } } }

  # ---------------------------------------------------------------- Catalog
  /programs:
    get:
      tags: [Catalog]
      security: []
      summary: Danh sách chương trình & thang điểm
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Program' } } } } }
  /programs/{program}/sections:
    get:
      tags: [Catalog]
      security: []
      summary: Cấu trúc Part/section của chương trình (theo cấp nếu có)
      parameters:
        - { $ref: '#/components/parameters/ProgramPath' }
        - { name: level, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Section' } } } } }
  /programs/{program}/test-sets:
    get:
      tags: [Catalog]
      summary: Danh sách đề (kèm cờ miễn phí, điểm lần gần nhất/cao nhất của người dùng)
      parameters:
        - { $ref: '#/components/parameters/ProgramPath' }
        - { name: kind, in: query, schema: { type: string, enum: [full, mini, part_drill, diagnostic, topic_pack] } }
        - { name: level, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestSetPage' } } } }
  /test-sets/{testSetId}:
    get:
      tags: [Catalog]
      summary: Chi tiết đề (section, số câu, thời lượng); nội dung câu hỏi chỉ trả khi mở attempt
      parameters: [ { $ref: '#/components/parameters/TestSetId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestSet' } } } }
        '402': { $ref: '#/components/responses/Error' }
  /lessons:
    get:
      tags: [Catalog]
      summary: Bài học / ngữ pháp / phát âm theo chương trình & kỹ năng
      parameters:
        - { $ref: '#/components/parameters/ProgramQuery' }
        - { name: kind, in: query, schema: { type: string, enum: [lesson, grammar, pronunciation, strategy] } }
        - { name: skill, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/LessonSummary' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /lessons/{lessonId}:
    get:
      tags: [Catalog]
      summary: Nội dung bài học theo bước + tiến độ người dùng
      parameters: [ { $ref: '#/components/parameters/LessonId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }
  /lessons/{lessonId}/steps/{stepNo}/complete:
    post:
      tags: [Catalog]
      summary: Hoàn thành một bước (kèm câu trả lời kiểm tra nếu có)
      parameters:
        - { $ref: '#/components/parameters/LessonId' }
        - { name: stepNo, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { answer: {} } }
      responses: { '200': { description: 'Tiến độ cập nhật, bước tiếp theo' } }
  /videos:
    get:
      tags: [Catalog]
      summary: Thư viện video shadowing
      parameters:
        - { $ref: '#/components/parameters/ProgramQuery' }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Video' } }, next_cursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [Speech]
      summary: Dán link YouTube (≤ 10 phút) → tách câu bất đồng bộ
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [program, youtube_url], properties: { program: { type: string }, youtube_url: { type: string, format: uri } } }
      responses:
        '202': { description: 'Đã nhận; trả `video_id`, `job_id`' }
        '422': { $ref: '#/components/responses/Error' }
  /videos/{videoId}:
    get:
      tags: [Catalog]
      summary: Video + danh sách câu (timestamp, IPA, bản dịch nếu có) + tiến độ
      parameters: [ { $ref: '#/components/parameters/VideoId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VideoDetail' } } } }
  /videos/{videoId}/translate:
    post:
      tags: [Speech]
      summary: Dịch toàn bộ câu sang ngôn ngữ người học (dùng chung, Free 3 video/ngày)
      parameters: [ { $ref: '#/components/parameters/VideoId' } ]
      responses:
        '202': { description: 'Đang dịch, trả `job_id`' }
        '402': { $ref: '#/components/responses/Error' }
  /vocab/lists:
    get:
      tags: [Catalog]
      summary: Danh sách bộ từ (hệ thống + của tôi) kèm tiến độ Mới/Đang học/Đến hạn
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VocabList' } } } } }
    post:
      tags: [Catalog]
      summary: Tạo bộ từ của tôi (có thể dán danh sách từ)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [program, title], properties: { program: { type: string }, title: { type: string }, headwords: { type: array, items: { type: string } } } }
      responses: { '201': { description: Đã tạo } }
  /vocab/lists/{listId}/items:
    get:
      tags: [Catalog]
      summary: Từ trong bộ (kèm trạng thái SRS)
      parameters: [ { name: listId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/VocabItem' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /dictionary/lookup:
    get:
      tags: [Catalog]
      summary: Tra từ/cụm theo ngữ cảnh (chạm từ trong đề)
      description: |
        v1.1 – Sprint 6. Tra headword hoặc dạng biến đổi (`forms`) trong `catalog.vocab_items` (từ điển mở, kind `word`); không khớp →
        gợi ý pg_trgm (`suggestions`). `ai=auto` (mặc định): không có trong từ điển và không có gợi ý gần (similarity ≥ 0,6 với từ đơn)
        → dịch AI `segment_translate` qua AiGateway, cache `ai.translation_cache` theo (term, context, locale, prompt version) chuẩn hoá;
        lần sau `cached: true` (không gọi model, không tính quota). Dịch AI tiêu quota `dictionary_ai` (Free theo `billing.quotas`).
        `audio_url` là URL ký 10 phút khi TTS đã có trong `ai.tts_cache`; chưa có → `null` và server sinh nền (gọi `GET /tts` để lấy ngay).
        Đang có attempt `exam` `in_progress` → 403 `exam_mode_locked` cho MỌI lần tra (không chỉ câu của đề).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 500 }, description: 'Từ/cụm/câu cần tra (bí danh `term` – v1.1)' }
        - { name: term, in: query, schema: { type: string, maxLength: 500 }, description: 'v1.1 – bí danh của q' }
        - { name: program, in: query, schema: { type: string, enum: [toeic, ielts, jlpt, hsk], default: toeic }, description: 'v1.1 – mặc định toeic' }
        - { name: context, in: query, schema: { type: string, maxLength: 300, description: 'Câu chứa từ, ≤ 300 ký tự' } }
        - { name: locale, in: query, schema: { type: string, enum: [vi, en, ja, ko, th] }, description: 'v1.1 – ngôn ngữ nghĩa/bản dịch; mặc định explain_locale của người học' }
        - { name: ai, in: query, schema: { type: string, enum: [auto, always, never], default: auto }, description: 'v1.1 – chính sách dịch AI khi không có trong từ điển' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DictionaryEntry' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { description: 'exam_mode_locked (đang thi) | forbidden (gói không có dictionary_ai)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'quota_exceeded (dictionary_ai) – details.quota = QuotaExceededDetails', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------------------------------------------------------- Attempts
  /attempts:
    post:
      tags: [Attempts]
      summary: Mở phiên làm bài (đề full / Part / diagnostic / drill)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptCreate' }
      responses:
        '201': { description: 'Phiên + nội dung câu hỏi (không có đáp án)', content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '402': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}:
    get:
      tags: [Attempts]
      summary: Trạng thái phiên + nháp đã lưu
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
  /attempts/{attemptId}/answers:
    put:
      tags: [Attempts]
      summary: Lưu nháp hàng loạt (upsert) – gọi mỗi 10 giây hoặc khi đổi câu
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [answers], properties: { answers: { type: array, items: { $ref: '#/components/schemas/AttemptAnswerInput' } }, section_elapsed_sec: { type: object, additionalProperties: { type: integer } }, ui_state: { $ref: '#/components/schemas/AttemptUiState' } } }
      responses: { '204': { description: Đã lưu } }
  /attempts/{attemptId}/events:
    post:
      tags: [Attempts]
      summary: Sự kiện phiên (rời tab, hết giờ section, phát audio)
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [type], properties: { type: { type: string, enum: [tab_leave, tab_hidden, section_timeout, audio_played, focus_lost, resume, part_switch, audio_started, audio_ended, audio_stalled], description: 'v1.1: thêm tab_hidden, focus_lost, resume, part_switch, audio_started/ended/stalled' }, at: { type: string, format: date-time }, meta: { type: object, description: 'JSON ≤ 2000 ký tự. Sự kiện audio_* (v1.1 – Sprint 4): `question_id`, `asset_id` (UUID), `position_ms`; audio_started với question_id thuộc attempt tăng Attempt.audio_plays[question_id] (thống kê, không chặn phát)', properties: { question_id: { type: string, format: uuid }, asset_id: { type: string, format: uuid }, position_ms: { type: integer, minimum: 0 } } } } }
      responses: { '202': { description: Đã ghi } }
  /attempts/{attemptId}/submit:
    post:
      tags: [Attempts]
      summary: Nộp bài → chấm tự động L&R, quy đổi điểm, phân tích Part
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      responses:
        '200': { description: Kết quả, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptResult' } } } }
  /attempts/{attemptId}/result:
    get:
      tags: [Attempts]
      summary: Kết quả đã chấm của attempt (idempotent, dùng khi tải lại trang kết quả)
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      responses:
        '200': { description: Kết quả, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptResult' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/media:
    get:
      tags: [Attempts]
      summary: "URL ký mới cho mọi media của attempt (audio/ảnh của câu, lựa chọn, passage) – gia hạn trong lúc làm bài (v1.1 – Sprint 4)"
      description: |
        URL media trong `Attempt.questions[].media[].url` / `passage.media_url` là URL ký hết hạn sau 10 phút (`expires_at`);
        đề L&R 120 phút cần gia hạn: client gọi endpoint này trước khi hết hạn (khuyến nghị khi còn ≤ 2 phút) và thay URL theo `id`
        (`media[].id`, `passage.media_asset_id`). Chỉ chủ attempt; attempt của người khác → 404. Mọi trạng thái (Review cần nghe lại).
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      responses:
        '200': { description: OK, headers: { Cache-Control: { schema: { type: string, example: no-store } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptMediaList' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/review:
    get:
      tags: [Attempts]
      summary: "Xem lại từng câu: đáp án, giải thích (cache), transcript/đoạn văn tô sáng, paraphrase"
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { name: only_wrong, in: query, schema: { type: boolean } }, { name: flagged, in: query, schema: { type: boolean }, description: 'Chỉ câu đã đánh dấu (v1.1)' }, { name: section, in: query, schema: { type: string }, description: 'Lọc theo Part (v1.1)' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptReview' } } } }
  /attempts/{attemptId}/diagnosis:
    post:
      tags: [AI]
      summary: Ask AI trên kết quả R/L – dạng sai nhiều nhất, vì sao, 3 bước kỹ thuật (stream)
      description: |
        v1.1 – Sprint 5 (`diagnose_rl`). Chỉ attempt đã chấm của chính người học; người học đang làm đề Exam Mode khác → 403
        `exam_mode_locked`; quyền `ai_diagnose` (Free → 403 `forbidden` + `details.upgrade`); credit theo `ai.model_routes`
        (402 `insufficient_credits`). SSE: `start` → `delta`* → `result` (data = AttemptAiDiagnosis) → `done`; lỗi AI →
        `error` → `done` (không trừ credit). Đã có kết quả của cùng phiên bản prompt + ngôn ngữ → `start{cached:true}` → `result` → `done`.
        Đang sinh (yêu cầu song song) → 409 `conflict` (`details.reason = in_progress`).
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      responses:
        '200': { description: SSE, content: { text/event-stream: { schema: { type: string } } } }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      tags: [AI]
      summary: Kết quả chẩn đoán AI đã lưu của attempt (màn kết quả tải lại) – v1.1 Sprint 5
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptAiDiagnosis' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /me/attempts:
    get:
      tags: [Attempts]
      summary: Lịch sử bài làm
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: mode, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AttemptSummary' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /practice/questions:
    get:
      tags: [Attempts]
      summary: Lấy lô câu luyện theo Part/dạng/chủ đề/kỹ năng con (ưu tiên độ khó phù hợp)
      parameters:
        - { $ref: '#/components/parameters/ProgramQuery' }
        - { name: section, in: query, schema: { type: string } }
        - { name: question_type, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: subskill, in: query, schema: { type: string } }
        - { name: count, in: query, schema: { type: integer, default: 10, maximum: 50 } }
        - { name: timed, in: query, schema: { type: boolean }, description: 'true → mode=timed_drill: `expires_at` = Σ thời gian trả lời theo Part (P1–P2 20 s, P3–P4 35 s, P5 25 s, P6–P7 60 s) hoặc per_question_sec × số câu, CỘNG với câu Listening: thời lượng audio của câu + `content.media.pause_ms` + audio nhóm (passage Part 3/4) tính một lần mỗi nhóm (media_assets.duration_ms; chưa rõ → ước tính 6 s/câu, 45 s/nhóm – v1.1 S5); không có feedback trước khi nộp. false → mode=drill, không giới hạn giờ, đáp án hiện ngay (v1.1 – Sprint 4)' }
        - { name: per_question_sec, in: query, schema: { type: integer, minimum: 5, maximum: 600 }, description: 'Ghi đè giây TRẢ LỜI mỗi câu cho timed_drill – không gồm audio/pause (v1.1 – Sprint 4/5)' }
        - { name: q, in: query, schema: { type: string }, description: 'Từ khoá (tìm qua Meilisearch/PG; chỉ câu đã phát hành) – v1.1' }
      description: |
        Nguồn câu (v1.1 – Sprint 4): ưu tiên câu người học CHƯA làm → câu làm SAI trong 30 ngày → ngẫu nhiên. Câu cùng passage
        (Part 3/4/6/7) luôn lấy trọn nhóm, liền nhau, `group_key` = passage id; số câu ≤ `count` (nhóm không vừa thì bỏ qua, trừ khi
        nhóm đầu tiên đã lớn hơn `count`).
      responses:
        '201': { description: Tạo attempt mode=drill (hoặc timed_drill khi timed=true) và trả câu hỏi, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
  /notes:
    get:
      tags: [Attempts]
      summary: Ghi chú của tôi (v1.1 – S6) – lọc theo câu/phiên bản/attempt/đề, tìm kiếm `q` (pg_trgm/ILIKE), cursor
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: question_version_id, in: query, schema: { type: string, format: uuid } }
        - { name: question_id, in: query, schema: { type: string, format: uuid } }
        - { name: attempt_id, in: query, schema: { type: string, format: uuid } }
        - { name: test_set_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Note' } }, next_cursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [Attempts]
      summary: Tạo ghi chú gắn câu hỏi (question_version_id) / attempt (v1.1 – S6)
      description: 'Markdown ngắn ≤ 2.000 ký tự sau khi làm sạch (bỏ thẻ HTML, liên kết javascript:). Đang thi (attempt exam in_progress) → 403 `exam_mode_locked`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteInput' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Attempts]
      summary: Bảng ghi chú theo đề/câu (Pro)
      description: 'v1.1 – S6: ghi đè ghi chú mới nhất của người học theo `question_id` (hoặc `test_set_id`), tạo mới nếu chưa có; trả Note. Đang thi → 403 `exam_mode_locked`. Spec v1.0 ghi "(Pro)" – S6 chưa chặn theo gói (SPEC-ISSUES S60).'
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [body], properties: { test_set_id: { type: string, format: uuid }, question_id: { type: string, format: uuid }, question_version_id: { type: string, format: uuid, description: v1.1 }, attempt_id: { type: string, format: uuid, description: v1.1 }, body: { type: string } } }
      responses:
        '200': { description: Đã lưu, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /notes/{noteId}:
    parameters: [ { name: noteId, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [Attempts]
      summary: Sửa ghi chú (v1.1 – S6)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Attempts]
      summary: Xoá ghi chú (v1.1 – S6)
      responses:
        '204': { description: Đã xoá }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- AI
  /ai/explain:
    post:
      tags: [AI]
      summary: Giải thích câu hỏi (cache theo phiên bản câu, đáp án chọn, ngôn ngữ); stream nếu chưa cache
      description: |
        v1.1 – Sprint 5. Ngôn ngữ = `explain_locale` của người học. Khoá cache = (question_version_id, chosen_option, explain_locale,
        prompt_version_id). Cache hit → JSON `Explanation` (`cached: true`, có `ai_task_id` để gửi /ai/feedback; không trừ credit/quota).
        Sinh mới → SSE `start` → `delta`* → `result` (data = Explanation) → `done`; lỗi AI → `error` (`ai_failed` | `ai_timeout`) → `done`
        (hoàn quota, không trừ credit). Exam Mode đang làm → 403 `exam_mode_locked`. Free vượt hạn mức ngày → 429 `quota_exceeded`
        với `details.quota` (QuotaExceededDetails); thiếu credit → 402 `insufficient_credits`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [question_version_id], properties: { question_version_id: { type: string, format: uuid }, chosen_option: { type: string }, attempt_id: { type: string, format: uuid } } }
      responses:
        '200':
          description: Giải thích (JSON khi cache hit, SSE khi sinh mới)
          content:
            application/json: { schema: { $ref: '#/components/schemas/Explanation' } }
            text/event-stream: { schema: { type: string } }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { description: 'quota_exceeded – details.quota = QuotaExceededDetails', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /ai/threads:
    get:
      tags: [AI]
      summary: Danh sách hội thoại gia sư
      description: 'v1.1 – S6: mới cập nhật trước, cursor `{data, next_cursor}`, mỗi thread kèm `turns`. Đang thi → 403 `exam_mode_locked`.'
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Thread' } }, next_cursor: { type: [string, 'null'] } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [AI]
      summary: Tạo hội thoại với ngữ cảnh (attempt/submission/lesson)
      description: |
        v1.1 – S6: ngữ cảnh `attempt_id` (bài của tôi) | `question_version_id` (câu đang xem, có thể kèm attempt_id chứa câu đó) | `kind: free`.
        attempt của người khác → 403; không tồn tại → 404; câu không thuộc attempt → 400. Đang thi → 403 `exam_mode_locked`.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { program: { type: string }, context: { $ref: '#/components/schemas/ThreadContext' }, title: { type: string, maxLength: 120, description: v1.1 } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Thread' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /ai/threads/{threadId}:
    get:
      tags: [AI]
      summary: Chi tiết hội thoại + tin nhắn mới nhất (v1.1 – S6)
      description: 'Tin nhắn cũ → mới (tối đa `limit`, mặc định 50); `next_cursor` tải trang cũ hơn qua GET /ai/threads/{id}/messages. Thread của người khác → 403. Đang thi → 403 `exam_mode_locked`.'
      parameters: [ { $ref: '#/components/parameters/ThreadId' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ThreadDetail' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /ai/threads/{threadId}/messages:
    get:
      tags: [AI]
      summary: Lịch sử tin nhắn
      description: 'v1.1 – S6: trang mới nhất trước khi không có cursor; mỗi trang sắp xếp cũ → mới; `next_cursor` trỏ tới trang CŨ hơn.'
      parameters: [ { $ref: '#/components/parameters/ThreadId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Message' } }, next_cursor: { type: [string, 'null'] } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [AI]
      summary: Gửi tin nhắn (text hoặc audio đã upload) → trả lời stream, có thể kèm action mở trang
      description: |
        v1.1 – S6. `text` 1–2.000 ký tự (S6 chưa nhận `recording_id` → 400). Thứ tự kiểm tra: Exam Mode (403 `exam_mode_locked`) →
        giới hạn lượt/thread theo gói (`billing.quotas` feature `ai_tutor_thread_turns` – vượt → 429 `quota_exceeded`, `details.quota.scope = thread`)
        → guard (`guard_classify` + luật cục bộ, PII bị che trước khi tới model) → entitlement/credit (402)/quota ngày `ai_tutor` (429) → stream.
        SSE giống /ai/explain: `start` {ai_task_id, cached} → `delta` {text = mảnh của reply_markdown, văn bản thuần} * → `result`
        {data = TutorReply, ai_task_id, cached} → `done`; lỗi AI → `error` {code: ai_failed | ai_timeout} → `done` (hoàn quota, không trừ credit).
        Bị guard từ chối: `start` → `result` (data.refused = true, data.refusal_code = injection | off_topic | answer_leak | unsafe,
        reply_markdown rỗng – web hiển thị theo i18n) → `done`; `ai_tasks.status = refused`, không gọi model chính, không trừ credit/lượt.
      parameters: [ { $ref: '#/components/parameters/ThreadId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { text: { type: string, maxLength: 2000 }, recording_id: { type: string, format: uuid }, want_audio: { type: boolean, default: false } } }
      responses:
        '200': { description: SSE start/delta/result/done (error), content: { text/event-stream: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { description: 'quota_exceeded – ai_tutor (ngày) hoặc ai_tutor_thread_turns (scope thread)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /ai/realtime/token:
    post:
      tags: [AI]
      summary: Cấp token phiên voice realtime (LiveKit) kèm kịch bản & hạn mức phút
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { program: { type: string }, scenario: { type: string, enum: [free_talk, ielts_part1, ielts_part2, ielts_part3, toeic_q11, mock_examiner] } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { room: { type: string }, token: { type: string }, max_seconds: { type: integer }, expires_at: { type: string, format: date-time } } } } } }
        '402': { $ref: '#/components/responses/Error' }
  /ai/feedback:
    post:
      tags: [AI]
      summary: Phản hồi chất lượng một kết quả AI (hữu ích / không / chấm sai)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ai_task_id, rating], properties: { ai_task_id: { type: string, format: uuid }, rating: { type: string, enum: [helpful, not_helpful, wrong] }, comment: { type: string, maxLength: 1000, description: 'Lý do (👎) – tuỳ chọn' } } }
      description: 'v1.1 – Sprint 5: chỉ chủ tác vụ (ai_tasks.user_id) – người khác 403, không tồn tại 404; gửi lại cho cùng tác vụ → cập nhật (`updated: true`).'
      responses:
        '201': { description: Đã ghi, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, id: { type: string, format: uuid }, ai_task_id: { type: string, format: uuid }, rating: { type: string }, updated: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Grading
  /uploads/presign:
    post:
      tags: [Grading]
      summary: Lấy URL tải lên trực tiếp S3 cho ghi âm/ảnh (PUT có hạn)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind, mime_type, size_bytes], properties: { kind: { type: string, enum: [recording, image] }, mime_type: { type: string }, size_bytes: { type: integer, maximum: 20971520 }, duration_ms: { type: integer } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { upload_url: { type: string }, resource_id: { type: string, format: uuid }, expires_at: { type: string, format: date-time } } } } } }
  /submissions:
    post:
      tags: [Grading]
      summary: Nộp bài Writing/Speaking/Impromptu/câu ngữ pháp → hàng đợi chấm (trừ credit khi hoàn tất)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionCreate' }
      responses:
        '202': { description: 'Đã xếp hàng; theo dõi qua GET hoặc WS `submission.graded`', content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
        '402': { $ref: '#/components/responses/Error' }
  /submissions/{submissionId}:
    get:
      tags: [Grading]
      summary: Trạng thái submission + kết quả (nếu đã chấm)
      parameters: [ { $ref: '#/components/parameters/SubmissionId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
  /submissions/{submissionId}/redo:
    post:
      tags: [Grading]
      summary: Làm lại cùng đề (liên kết parent để so band)
      parameters: [ { $ref: '#/components/parameters/SubmissionId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionCreate' }
      responses:
        '202': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
  /grading-results/{resultId}/phrasing-fixes:
    post:
      tags: [Grading]
      summary: Upgrade your phrasing – gửi câu tự sửa cho một lỗi, AI chấm Fixed/Partly/Not yet
      parameters: [ { name: resultId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [error_index, user_rewrite], properties: { error_index: { type: integer }, user_rewrite: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { verdict: { type: string, enum: [fixed, partly, not_yet] }, note: { type: string }, remaining_today: { type: integer } } } } } }
  /impromptu/draw:
    post:
      tags: [Grading]
      summary: Quay đề Speaking bất ngờ theo Part/nhóm chủ đề + khung gợi ý
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { program: { type: string, default: ielts }, part: { type: string, enum: [part1, part2, part3, toeic_q11] }, topic_group: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ImpromptuPrompt' } } } }
  /me/submissions:
    get:
      tags: [Grading]
      summary: Lịch sử bài Writing/Speaking kèm band theo lần
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: kind, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Submission' } }, next_cursor: { type: [string, 'null'] } } } } } }

  # ---------------------------------------------------------------- Speech
  /shadowing/score:
    post:
      tags: [Speech]
      summary: Chấm một câu shadowing (ghi âm đã upload) – độ chính xác, nhịp, ngữ điệu, từ đúng/sai
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [video_sentence_id, recording_id], properties: { video_sentence_id: { type: string, format: uuid }, recording_id: { type: string, format: uuid } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PronunciationScore' } } } }
        '402': { $ref: '#/components/responses/Error' }
  /pronunciation/score:
    post:
      tags: [Speech]
      summary: Chấm phát âm từ/câu mẫu trong khoá phát âm (âm vị, thanh điệu, pitch contour)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reference_text, language, recording_id], properties: { reference_text: { type: string }, language: { type: string, enum: [en-US, en-GB, en-AU, ja-JP, zh-CN] }, recording_id: { type: string, format: uuid }, exercise_id: { type: string, format: uuid } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PronunciationScore' } } } }
  /tts:
    get:
      tags: [Speech]
      summary: Audio TTS cho chuỗi (cache), trả URL
      description: 'v1.1 – S6: cache `ai.tts_cache` theo (provider, locale, văn bản chuẩn hoá) × voice; URL ký 10 phút (`expires_at`). `voice` nhận bí danh `en-US-neural-f|m`, `en-GB-neural-f|m` hoặc tên giọng Azure `xx-YY-<Name>Neural`.'
      parameters:
        - { name: text, in: query, required: true, schema: { type: string, maxLength: 500 } }
        - { name: voice, in: query, schema: { type: string, default: en-US-neural-f } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string }, duration_ms: { type: integer }, expires_at: { type: [string, 'null'], format: date-time, description: v1.1 }, cached: { type: boolean, description: v1.1 }, voice: { type: string, description: v1.1 } } } } } }
        '400': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Learning
  /me/plan:
    get:
      tags: [Learning]
      summary: "Lộ trình hiện tại (Free: tuần này; Pro: toàn bộ) + tiến độ"
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudyPlan' } } } }
  /me/plan/today:
    get:
      tags: [Learning]
      summary: Việc hôm nay (2–4 việc, kèm khởi động từ vựng nếu đủ điều kiện)
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { date: { type: string, format: date }, focus: { type: string }, tasks: { type: array, items: { $ref: '#/components/schemas/PlanTask' } }, warmup: { type: object, nullable: true } } } } } }
  /me/plan/regenerate:
    post:
      tags: [Learning]
      summary: Sinh lại lộ trình (sau đổi mục tiêu/ngày thi)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [program], properties: { program: { type: string } } }
      responses: { '202': { description: Đang sinh; WS `plan.updated` } }
  /me/plan/checkin:
    post:
      tags: [Learning]
      summary: Điểm danh tuần → điều chỉnh tuần sau kèm bằng chứng
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [program], properties: { program: { type: string }, availability_next_week: { type: object } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlanWeek' } } } }
  /me/plan/adjust:
    post:
      tags: [Learning]
      summary: Chỉnh lịch bằng ngôn ngữ tự nhiên → đề xuất trước/sau (chưa áp dụng)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [program, instruction], properties: { program: { type: string }, instruction: { type: string, example: 'Đổi buổi thứ Ba với thứ Năm giúp mình' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlanAdjustProposal' } } } }
  /me/plan/adjust/{proposalId}/apply:
    post:
      tags: [Learning]
      summary: Áp dụng đề xuất (có thể Hoàn tác trong 24 giờ)
      parameters: [ { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK } }
  /plan-tasks/{taskId}:
    patch:
      tags: [Learning]
      summary: Đánh dấu việc (done/skipped) hoặc gắn kết quả
      parameters: [ { name: taskId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { status: { type: string, enum: [pending, done, skipped] }, result_ref: { type: object } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlanTask' } } } } }
  /me/diagnostic/{attemptId}/next:
    post:
      tags: [Learning]
      summary: "Diagnostic thích ứng (CAT): gửi câu trả lời, nhận câu kế tiếp hoặc kết luận"
      parameters: [ { $ref: '#/components/parameters/AttemptId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptAnswerInput' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { done: { type: boolean }, next_question: { $ref: '#/components/schemas/QuestionPublic' }, estimate: { type: object, properties: { score: { type: number }, se: { type: number } } } } } } } }
  /me/srs/due:
    get:
      tags: [Learning]
      summary: Thẻ đến hạn (từ vựng, lỗi, ngữ pháp, âm) theo chương trình, giới hạn số thẻ/phiên
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: card_type, in: query, schema: { type: string } }, { name: list_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SrsCard' } } } } }
  /me/srs/review:
    post:
      tags: [Learning]
      summary: Ghi kết quả ôn (FSRS rating 1–4) hàng loạt → lịch ôn mới
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reviews], properties: { reviews: { type: array, items: { type: object, required: [card_id, rating], properties: { card_id: { type: string, format: uuid }, rating: { type: integer, minimum: 1, maximum: 4 }, review_mode: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SrsCard' } } } } }
  /me/srs/cards:
    post:
      tags: [Learning]
      summary: Thêm thẻ (lưu từ từ bài đọc/feedback, thêm từ tự do, lưu bản đồ paraphrase)
      description: |
        v1.1 – S6: chỉ `card_type = vocab` (loại khác → 400, làm ở S10). `ref_id` = vocab_item_id, hoặc `headword` (tra từ điển; không có →
        tạo mục `catalog.vocab_items` source `ai`/status `draft` từ bản dịch đã cache). Thẻ mới `state = new`, `due_at = now` (lịch FSRS ở S10).
        Idempotent theo (user, card_type, ref_id): đã có → 200 `created: false`; mới → 201 (tiêu quota `srs_new_cards`, vượt → 429).
        Đang thi → không chặn (không lộ đáp án).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [program, card_type], properties: { program: { type: string }, card_type: { type: string, enum: [vocab, error, grammar, phoneme, sentence] }, ref_id: { type: string, format: uuid }, headword: { type: string }, source_type: { type: string }, source_id: { type: string, format: uuid }, context: { type: string, maxLength: 300, description: 'v1.1 – câu chứa từ' } } }
      responses:
        '200': { description: 'Đã có (v1.1)', content: { application/json: { schema: { $ref: '#/components/schemas/SrsCard' } } } }
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SrsCard' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /me/errors:
    get:
      tags: [Learning]
      summary: Nhật ký lỗi 7/30 ngày kèm lý do, phân bố "điểm rơi", bản đồ paraphrase
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: days, in: query, schema: { type: integer, default: 30 } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorLogPage' } } } }
  /me/errors/{entryId}:
    patch:
      tags: [Learning]
      summary: Đổi lý do sai / đánh dấu đã khắc phục
      parameters: [ { name: entryId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason_override: { type: string }, resolved: { type: boolean } } }
      responses: { '200': { description: OK } }
  /me/stats:
    get:
      tags: [Learning]
      summary: "Dashboard: điểm ước tính vs mục tiêu, xu hướng 30 ngày, theo Part/dạng, streak, XP"
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
  /me/forecast:
    get:
      tags: [Learning]
      summary: Dự báo điểm có khoảng tin cậy & ngày sẵn sàng thi (GĐ4)
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Forecast' } } } }

  # ---------------------------------------------------------------- Billing
  /plans:
    get:
      tags: [Billing]
      security: []
      summary: Gói & giá hiện hành theo chương trình/khu vực
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: region, in: query, schema: { type: string, default: VN } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } }
  /promotions/validate:
    post:
      tags: [Billing]
      summary: Kiểm tra mã giảm giá cho gói
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code, plan_id], properties: { code: { type: string }, plan_id: { type: string, format: uuid } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { valid: { type: boolean }, discount: { type: number }, total: { type: number }, currency: { type: string } } } } } }
  /orders:
    post:
      tags: [Billing]
      summary: Tạo đơn hàng (giá chốt, mã giảm) – chưa thanh toán
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [plan_id], properties: { plan_id: { type: string, format: uuid }, promotion_code: { type: string }, quantity: { type: integer, default: 1 }, buyer_info: { $ref: '#/components/schemas/BuyerInfo' } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
  /orders/{orderId}:
    get:
      tags: [Billing]
      summary: Trạng thái đơn hàng, thanh toán, hoá đơn
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
  /orders/{orderId}/pay:
    post:
      tags: [Billing]
      summary: Khởi tạo thanh toán với cổng → URL/deeplink chuyển hướng
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [provider], properties: { provider: { type: string, enum: [vnpay, momo, zalopay, payos, stripe] }, return_url: { type: string, format: uri } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { payment_id: { type: string, format: uuid }, redirect_url: { type: string }, qr_code: { type: string }, expires_at: { type: string, format: date-time } } } } } }
  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      security: []
      summary: Callback IPN từ cổng (xác minh chữ ký, idempotent theo provider_txn_id)
      parameters: [ { name: provider, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object } }, application/x-www-form-urlencoded: { schema: { type: object } } } }
      responses:
        '200': { description: Theo định dạng từng cổng yêu cầu }
  /me/subscriptions:
    get:
      tags: [Billing]
      summary: Gói đang có theo chương trình, chu kỳ, trạng thái gia hạn
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } }
  /me/subscriptions/{subscriptionId}/cancel:
    post:
      tags: [Billing]
      summary: Huỷ gia hạn (dùng đến hết chu kỳ)
      parameters: [ { name: subscriptionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } } }
  /me/credits:
    get:
      tags: [Billing]
      summary: Số dư credit, sắp hết hạn, bảng giá credit theo tác vụ
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CreditBalance' } } } }
  /me/credits/ledger:
    get:
      tags: [Billing]
      summary: Lịch sử credit (nạp/tiêu)
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /me/entitlements:
    get:
      tags: [Billing]
      summary: Quyền tính năng & hạn mức còn lại hôm nay/tháng này (client dùng để gating UI)
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlements' } } } }

  # ---------------------------------------------------------------- Growth
  /me/notification-preferences:
    get:
      tags: [Growth]
      summary: Kênh & khung giờ thông báo
      description: 'v1.1 – S6: chưa có hàng → trả mặc định DDL (email/push/inapp bật, zalo tắt, 22:00–07:00, nhắc 20:00).'
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } } }
    patch:
      tags: [Growth]
      summary: Cập nhật kênh/khung giờ
      description: 'v1.1 – S6: cập nhật một phần (channels gộp theo khoá); giờ dạng HH:MM, ≤ 5 giờ nhắc. Trả bản đầy đủ.'
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /me/push-subscriptions:
    get:
      tags: [Growth]
      summary: Thiết bị đã đăng ký Web Push (v1.1 – S6)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PushSubscription' } }, next_cursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [Growth]
      summary: Đăng ký Web Push (VAPID) – body là PushSubscription.toJSON() của trình duyệt (v1.1 – S6)
      description: 'Idempotent theo `endpoint`: đã có → 200 `created: false` (cập nhật khoá, chuyển sang người dùng hiện tại); mới → 201. Lưu `ops.push_subscriptions`. Server chưa cấu hình VAPID → 503 `feature_disabled`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '200': { description: Đã có, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscription' } } } }
        '201': { description: Đã đăng ký, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscription' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /me/push-subscriptions/{subscriptionId}:
    delete:
      tags: [Growth]
      summary: Huỷ đăng ký Web Push của một thiết bị (v1.1 – S6)
      parameters: [ { name: subscriptionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Đã huỷ }
        '404': { $ref: '#/components/responses/Error' }
  /push/vapid-public-key:
    get:
      tags: [Growth]
      summary: Khoá công khai VAPID cho pushManager.subscribe (công khai, v1.1 – S6)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { public_key: { type: [string, 'null'] }, enabled: { type: boolean } } } } } }
  /me/notifications:
    get:
      tags: [Growth]
      summary: Thông báo in-app
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: OK } }
  /me/referral:
    get:
      tags: [Growth]
      summary: Mã/link giới thiệu, thống kê, credit đã nhận
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralSummary' } } } } }
  /integrations/google-calendar:
    post:
      tags: [Growth]
      summary: Kết nối Google Calendar (OAuth code) → đồng bộ lộ trình 3 tuần
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string }, redirect_uri: { type: string } } } } } }
      responses: { '200': { description: Đã kết nối } }
    delete:
      tags: [Growth]
      summary: Ngắt kết nối và xoá lịch Allingo
      responses: { '204': { description: OK } }

  # ---------------------------------------------------------------- B2B
  /orgs:
    post:
      tags: [B2B]
      summary: Tạo tổ chức (trường/trung tâm/doanh nghiệp)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationInput' } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } } }
  /orgs/{orgId}/classes:
    get:
      tags: [B2B]
      summary: Lớp trong tổ chức
      parameters: [ { $ref: '#/components/parameters/OrgId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Class' } } } } } }
    post:
      tags: [B2B]
      summary: Tạo lớp
      parameters: [ { $ref: '#/components/parameters/OrgId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, program: { type: string }, teacher_user_id: { type: string, format: uuid } } } } } }
      responses: { '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Class' } } } } }
  /classes/{classId}/members:
    post:
      tags: [B2B]
      summary: Thêm học viên (email/mời), cấp seat
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [emails], properties: { emails: { type: array, items: { type: string, format: email } } } } } } }
      responses: { '201': { description: Đã mời } }
  /classes/{classId}/assignments:
    post:
      tags: [B2B]
      summary: Giao bài (đề/bài học/Writing/Speaking) kèm hạn
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentInput' } } } }
      responses: { '201': { description: OK } }
  /classes/{classId}/report:
    get:
      tags: [B2B]
      summary: "Báo cáo lớp: tiến độ, điểm ước tính, hoàn thành bài giao"
      parameters: [ { $ref: '#/components/parameters/ClassId' }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK } }

  # ---------------------------------------------------------------- Admin
  /admin/questions:
    get:
      tags: [Admin]
      summary: Tìm câu hỏi theo trạng thái/Part/dạng/nguồn
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: status, in: query, schema: { type: string } }, { name: section, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string }, description: 'Tìm trong đề bài (v1.1)' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: OK } }
    post:
      tags: [Admin]
      summary: Tạo câu hỏi (phiên bản 1, trạng thái draft)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminQuestionInput' } } } }
      responses: { '201': { description: OK } }
  /admin/questions/{questionId}/versions:
    get:
      tags: [Admin]
      summary: Lịch sử phiên bản câu hỏi (v1.1 – Sprint 2)
      parameters: [ { name: questionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK } }
    post:
      tags: [Admin]
      summary: Tạo phiên bản mới cho câu hỏi
      parameters: [ { name: questionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: object }, metadata: { type: object }, change_note: { type: string } } } } } }
      responses: { '201': { description: OK } }
  /admin/content/{entityType}/{entityId}/review:
    post:
      tags: [Admin]
      summary: Ghi quyết định duyệt (AI check / GV1 / GV2) → chuyển trạng thái
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string, enum: [question, passage, lesson, exercise, video, vocab_item] } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [stage, decision], properties: { stage: { type: string, enum: [ai_check, review1, review2] }, decision: { type: string, enum: [approve, reject, needs_change, submit, retire, reopen], description: 'approve/reject/needs_change ghi content_reviews; submit/retire/reopen là mốc chuyển trạng thái (v1.1)' }, notes: { type: string } } } } } }
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /admin/questions/{questionId}/ai-check:
    post:
      tags: [Admin]
      summary: Chạy AI kiểm tra (check_question) cho bản đang soạn và ghi review stage ai_check (v1.1 – Sprint 2)
      parameters: [ { name: questionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } }
  /admin/generate/questions:
    post:
      tags: [Admin]
      summary: Sinh lô câu hỏi bằng AI theo schema → Nháp + AI check tự động (job)
      description: |
        v1.1 – Sprint 5. Job `content.generate`: generate_questions (lô 10) → draft `source = ai` (external_ref `ai-gen:<job_id>:<n>`)
        → check_question (review stage ai_check) → dedup: embedding cosine ≥ 0,92 với câu published cùng chương trình + section
        (ai.embeddings), pg_trgm ≥ 0,85, trùng trong lô → `duplicate.flagged`. Quyền editor/teacher/admin.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [program, section, question_type, count], properties: { program: { type: string }, section: { type: string }, question_type: { type: string }, topic: { type: string }, difficulty: { type: string }, count: { type: integer, minimum: 1, maximum: 50 }, passage_id: { type: string, format: uuid } } } } } }
      responses:
        '202': { description: job_id, content: { application/json: { schema: { type: object, properties: { job_id: { type: string, format: uuid }, status: { type: string }, mode: { type: string, enum: [queued, inline] }, poll_url: { type: string } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /admin/generate/questions/{jobId}:
    get:
      tags: [Admin]
      summary: Trạng thái / kết quả job sinh câu hỏi AI (v1.1 – Sprint 5)
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateQuestionsJob' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/test-sets/generate:
    post:
      tags: [Admin]
      summary: "Sinh đề mini ngẫu nhiên lặp lại được (seed, PRNG mulberry32) từ ngân hàng câu đã phát hành → catalog.test_sets kind=mini (v1.1 – Sprint 4)"
      description: |
        Quyền editor/admin. Blueprint mặc định TOEIC 60 câu: P1 6 · P2 10 · P3 9 (3 hội thoại) · P4 9 (3 bài nói) · P5 10 · P6 4 (1 đoạn) ·
        P7 12 (đoạn đơn + ≥ 1 bộ nhiều văn bản). Nhóm passage luôn lấy trọn; kết quả qua kiểm tra cấu trúc `mini`. Cùng `seed` + cùng
        ngân hàng (`bank_fingerprint`) → cùng câu; cùng `code` → cập nhật đề cũ. Ngân hàng thiếu → `shortfall` (vẫn tạo nếu ≥ 1 câu).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateTestSetInput' } } } }
      responses:
        '201': { description: Đã tạo/cập nhật, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateTestSetResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/prompts:
    get:
      tags: [Admin]
      summary: Prompt templates & phiên bản
      description: 'v1.1 – Sprint 5: mỗi template kèm route (model_routes) và phiên bản (status, canary_percent, latest_eval).'
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PromptTemplate' } } } } } } } }
    post:
      tags: [Admin]
      summary: Tạo prompt template (code thuộc 14 task_code; program tuỳ chọn) – v1.1 Sprint 5
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string }, program: { type: string, nullable: true }, description: { type: string } } } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromptTemplate' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /admin/prompts/{templateId}/versions:
    post:
      tags: [Admin]
      summary: Tạo phiên bản prompt (draft) kèm rubric/output schema/model policy
      parameters: [ { name: templateId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromptVersionInput' } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PromptVersion' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/prompts/versions/{versionId}/status:
    patch:
      tags: [Admin]
      summary: draft → canary(x%) → active → retired; chặn active nếu eval chưa đạt
      description: |
        v1.1 – Sprint 5. canary/active cần một `ai.eval_runs` của phiên bản với `passed = true`, KHÔNG phải mock, metrics đạt
        `eval.thresholds` (allingo-prompts.yaml) → thiếu: 409 `conflict`, `details.reason = eval_required`, `details.eval_gate`.
        `ALLOW_UNEVALUATED_ACTIVATION=true` chỉ có hiệu lực ở APP_ENV development/test. Kích hoạt → active cũ thành retired,
        cache giải thích của phiên bản cũ bị xoá. Hợp lệ: draft→canary|active|retired, canary→draft|active|retired, active→retired
        (cần canary thay thế), retired→draft. canary_percent 1–50 (mặc định 10), chia người dùng theo hash user_id ổn định.
      parameters: [ { name: versionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [draft, canary, active, retired] }, canary_percent: { type: integer, minimum: 1, maximum: 50 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { version: { $ref: '#/components/schemas/PromptVersion' }, changed: { type: boolean }, eval_gate: { type: object, nullable: true }, retired_version_ids: { type: array, items: { type: string, format: uuid } }, invalidated_cache_rows: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/eval-runs:
    get:
      tags: [Admin]
      summary: Danh sách eval run (mới nhất trước) – v1.1 Sprint 5
      parameters: [ { name: task_code, in: query, schema: { type: string } }, { name: prompt_version_id, in: query, schema: { type: string, format: uuid } }, { name: eval_set_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/EvalRun' } }, next_cursor: { type: [string, 'null'] } } } } } } }
    post:
      tags: [Admin]
      summary: Chạy eval set với phiên bản prompt/model (job)
      description: 'v1.1 – Sprint 5: job `eval.run`; provider mock → run ghi `metrics.mock = true`, `passed = false` (không mở cổng kích hoạt).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [eval_set_id, prompt_version_id], properties: { eval_set_id: { type: string, format: uuid }, prompt_version_id: { type: string, format: uuid }, model: { type: string } } } } } }
      responses: { '202': { description: run_id, content: { application/json: { schema: { type: object, properties: { run_id: { type: string, format: uuid }, status: { type: string }, mock: { type: boolean }, job_id: { type: string }, mode: { type: string } } } } } } }
  /admin/plans:
    put:
      tags: [Admin]
      summary: Cập nhật gói/giá/quota/bảng credit (không cần deploy)
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: OK } }
  /admin/flags/{key}:
    put:
      tags: [Admin]
      summary: Bật/tắt feature flag theo quy tắc
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, rules: { type: object } } } } } }
      responses: { '200': { description: OK } }
  /admin/users/{userId}/credits:
    post:
      tags: [Admin]
      summary: Cấp/điều chỉnh credit thủ công (ghi audit)
      parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [delta, note], properties: { delta: { type: integer }, note: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /admin/notifications/test:
    post:
      tags: [Admin]
      summary: Gửi thử thông báo đẩy "Đến giờ học" tới các thiết bị của một người dùng (v1.1 – S6)
      description: |
        Vai trò admin. Mặc định gửi cho chính admin. Ghi `ops.notifications` (channel push, template_code), gửi tới mọi
        `ops.push_subscriptions` của người nhận; endpoint trả 404/410 → xoá đăng ký. Người nhận tắt `channels.push` → `skipped`
        trừ khi `force = true`. Payload = PushPayload (`title`/`body` null → service worker dịch theo `template_code`). Lịch tự động ở S9.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTestNotificationInput' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTestNotificationResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/reports/ai-costs:
    get:
      tags: [Admin]
      summary: Chi phí AI theo ngày/tác vụ/model, credit tiêu, cache hit, chất lượng eval
      description: 'v1.1 – Sprint 5: `from`/`to` là ngày lịch Asia/Ho_Chi_Minh (mặc định 30 ngày); tổng `cost_usd` = tổng ai_tasks.cost_usd (cùng giá trị gửi Langfuse `usage.totalCost`).'
      parameters: [ { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AiCostReport' } } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cookieAuth: { type: apiKey, in: cookie, name: allingo_at }
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    ProgramPath: { name: program, in: path, required: true, schema: { type: string, enum: [toeic, ielts, jlpt, hsk] } }
    ProgramQuery: { name: program, in: query, required: true, schema: { type: string, enum: [toeic, ielts, jlpt, hsk] } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    TestSetId: { name: testSetId, in: path, required: true, schema: { type: string, format: uuid } }
    LessonId: { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
    VideoId: { name: videoId, in: path, required: true, schema: { type: string, format: uuid } }
    AttemptId: { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    ThreadId: { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
    SubmissionId: { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    OrgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassId: { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Lỗi theo envelope chuẩn
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthTokens:
      description: Token & người dùng
      headers:
        Set-Cookie: { description: 'allingo_at / allingo_rt (web)', schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token: { type: string }
              refresh_token: { type: string, description: Chỉ trả cho mobile }
              expires_in: { type: integer, example: 900 }
              user: { $ref: '#/components/schemas/User' }
  schemas:
    I18nText:
      type: object
      additionalProperties: { type: string }
      example: { vi: 'Nghe hiểu', en: 'Listening' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: quota_exceeded, description: 'validation_failed | unauthorized | forbidden | not_found | conflict | quota_exceeded | insufficient_credits | payment_failed | rate_limited | exam_mode_locked | feature_disabled | internal' }
            message: { type: string }
            details: { type: object }
            trace_id: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        ui_locale: { type: string }
        explain_locale: { type: string }
        timezone: { type: string }
        is_guest: { type: boolean }
        roles: { type: array, items: { type: string } }
        active_program: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    UserUpdate:
      type: object
      properties:
        display_name: { type: string }
        avatar_url: { type: string }
        ui_locale: { type: string, enum: [vi, en, ja, ko, th] }
        explain_locale: { type: string, enum: [vi, en, ja, ko, th] }
        timezone: { type: string }
        active_program: { type: string }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        device: { type: object }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
    Consent:
      type: object
      properties:
        type: { type: string }
        version: { type: string }
        granted_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    Program:
      type: object
      properties:
        code: { type: string }
        name: { $ref: '#/components/schemas/I18nText' }
        score_scale: { type: object }
        languages: { type: array, items: { type: string } }
    Section:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        skill: { type: string }
        name: { $ref: '#/components/schemas/I18nText' }
        level: { type: string, nullable: true }
        duration_sec: { type: integer }
        question_count: { type: integer }
        rules: { type: object }
    EnrollmentInput:
      type: object
      required: [program]
      properties:
        program: { type: string, enum: [toeic, ielts, jlpt, hsk] }
        target_score: { type: number }
        target_level: { type: string }
        exam_date: { type: string, format: date }
        daily_minutes: { type: integer, minimum: 10, maximum: 240 }
        self_assessed_level: { type: string }
    Enrollment:
      type: object
      properties:
        id: { type: string, format: uuid }
        program: { type: string }
        target_score: { type: number, nullable: true }
        target_level: { type: string, nullable: true }
        exam_date: { type: string, format: date, nullable: true }
        daily_minutes: { type: integer }
        current_level: { type: object }
        days_to_exam: { type: integer, nullable: true }
        diagnostic_attempt_id: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time }
    TestSetSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { $ref: '#/components/schemas/I18nText' }
        kind: { type: string }
        level: { type: string, nullable: true }
        is_free: { type: boolean }
        locked: { type: boolean, description: true nếu cần Pro }
        duration_sec: { type: integer }
        question_count: { type: integer }
        last_score: { type: number, nullable: true }
        best_score: { type: number, nullable: true }
        attempts_count: { type: integer }
    TestSetPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TestSetSummary' } }
        next_cursor: { type: [string, 'null'] }
    TestSet:
      allOf:
        - { $ref: '#/components/schemas/TestSetSummary' }
        - type: object
          properties:
