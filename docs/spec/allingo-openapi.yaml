        status=open&sort=oldest&limit=10 = 10 lỗi chưa hiểu cũ nhất mọi thời gian). `distribution`/`by_section` theo bộ lọc
        (trừ `kind`); `paraphrase_map` rỗng tới GĐ2 (AI gán nhãn).
      parameters: [ { $ref: '#/components/parameters/ProgramQuery' }, { name: kind, in: query, schema: { type: string, enum: [paraphrase, trap, vocabulary, timeout, grammar, listening_detail, inference, spelling, tone, pronunciation, other] } }, { name: part, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string, enum: [open, resolved, all], default: open } }, { name: days, in: query, schema: { type: integer, minimum: 0, description: 'mặc định 30 (sort=newest) / 0 (sort=oldest)' } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { name: sort, in: query, schema: { type: string, enum: [newest, oldest], default: newest } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
