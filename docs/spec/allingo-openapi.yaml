      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationManage' } } } }
        '400': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Growth]
      security: []
      summary: Cập nhật tuỳ chọn theo token (categories, channels.email) (v1.1 – S8)
      parameters: [ { name: token, in: query, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { categories: { $ref: '#/components/schemas/NotificationCategoriesPatch' }, channels: { type: object, properties: { email: { type: boolean } } } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationManage' } } } }
        '400': { $ref: '#/components/responses/Error' }
