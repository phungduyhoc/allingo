        - { name: utm_medium, in: query, schema: { type: string } }
        - { name: utm_campaign, in: query, schema: { type: string } }
        - { name: utm_content, in: query, schema: { type: string } }
        - { name: utm_term, in: query, schema: { type: string } }
      responses:
        '200': { description: 'text/html (meta refresh)', content: { text/html: { schema: { type: string } } } }
