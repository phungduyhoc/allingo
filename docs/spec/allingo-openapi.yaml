      description: 'v1.1 – S10: `resolved` = "đã hiểu" (biến mất khỏi task review_errors; false mở lại), `note` ghi chú (≤ 1.000 ký tự, null xoá), `create_card` tạo thẻ SRS kind `error` (idempotent). Trả mục đã cập nhật.'
