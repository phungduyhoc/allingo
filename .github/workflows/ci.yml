name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  APP_ENV: test
  DATABASE_URL: postgres://allingo:allingo@localhost:5432/allingo
  DATABASE_URL_MIGRATE: postgres://allingo:allingo@localhost:5432/allingo
  TEST_DATABASE_URL: postgres://allingo:allingo@localhost:5432/allingo_test
  REDIS_URL: redis://localhost:6379
  AI_PROVIDER: mock
  SPEECH_PROVIDER: mock
  AUTH_SECRET: ci-only-secret-at-least-32-characters-long
  PAYLOAD_SECRET: ci-only-payload-secret
  NEXT_PUBLIC_API_URL: http://localhost:4000/v1
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # phiên bản lấy từ package.json "packageManager" (khai báo cả hai → lỗi "Multiple versions")
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit test không cần DB (api/db chạy ở job integration vì cần Postgres/Redis)
      - run: pnpm turbo run test --filter='!@allingo/api' --filter='!@allingo/db'

  integration:
    name: Integration · db:diff · api:diff · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: allingo
          POSTGRES_PASSWORD: allingo
          POSTGRES_DB: allingo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U allingo -d allingo"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # phiên bản lấy từ package.json "packageManager" (khai báo cả hai → lỗi "Multiple versions")
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ffmpeg cho test pipeline media (thiếu → test media tự skip, nên phải cài để không bỏ sót)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # @allingo/db nằm ở db/ (không thuộc packages/*) – API/integration đọc bản dist
      - run: pnpm --filter './packages/*' --filter @allingo/db build
      # S11: chặn DROP/RENAME/khoá bảng trong migration mới không có cờ `-- migration-guard: allow <lý do>`
      - run: pnpm --filter @allingo/db migration:guard
      - run: pnpm db:migrate
      - run: pnpm db:seed --set core,demo
      - run: pnpm db:diff
      - run: pnpm --filter @allingo/db test
      - run: pnpm --filter @allingo/api test
      - run: pnpm api:openapi && pnpm api:diff
      # Build web/cms/api (CMS build cần DATABASE_URL vì Payload đọc schema cms)
      - run: pnpm build
      - name: Upload web build stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-stats
          path: apps/web/.next/build-manifest.json
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright, API giả lập)
    runs-on: ubuntu-latest
    timeout-minutes: 50 # S12: 168 ca (desktop + mobile) ≈ 30–40 phút với 1 worker
    continue-on-error: true # Sprint 0: chưa chặn merge; E2E với API thật chạy thủ công (E2E_REAL_API=1)
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # phiên bản lấy từ package.json "packageManager" (khai báo cả hai → lỗi "Multiple versions")
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' build
      - run: pnpm --filter @allingo/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  security:
    name: Security (gitleaks · audit · semgrep · trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4 # phiên bản lấy từ package.json "packageManager" (khai báo cả hai → lỗi "Multiple versions")
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # S11: chặn lỗ hổng high/critical (ngoại lệ có hạn ở pnpm-workspace.yaml auditConfig.ignoreGhsas – docs/security/pentest-1.md)
      - run: pnpm audit --audit-level high
      # Semgrep: ruleset TS/Node/Next + JWT + secrets + luật riêng (.semgrep/allingo.yml)
      - name: Semgrep
        run: |
          pipx install semgrep==1.183.0
          semgrep scan --metrics=off --error \
            --config p/typescript --config p/nodejsscan --config p/jwt --config p/secrets --config p/react --config p/nextjs \
            --config .semgrep/ \
            --exclude 'node_modules' --exclude '**/*.test.ts' --exclude 'apps/web/e2e/**' \
            --text --sarif-output=semgrep.sarif apps packages db
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0' # fs: báo cáo (lockfile đã chặn bằng pnpm audit)
      # S11: Trivy quét IMAGE api (base + OS packages + node_modules production) – chặn CRITICAL/HIGH có bản vá
      - name: Build image api
        run: docker build -f apps/api/Dockerfile -t allingo-api:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: allingo-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  observability:
    name: Observability as code (promtool · amtool · dashboards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: promtool + amtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz | tar xz
          curl -sSL https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz | tar xz
          ./prometheus-3.5.0.linux-amd64/promtool check rules infra/observability/prometheus/rules/*.yml
          ./prometheus-3.5.0.linux-amd64/promtool test rules infra/observability/prometheus/tests/alerts.test.yml
          mkdir -p /tmp/am/secrets && for f in smtp_password slack_oncall_webhook slack_alerts_webhook telegram_bot_token; do echo "https://example.invalid/x" > /tmp/am/secrets/$f; done
          sed "s#/etc/alertmanager/secrets#/tmp/am/secrets#g; s#/etc/alertmanager/templates#infra/observability/alertmanager/templates#g" infra/observability/alertmanager/alertmanager.yml > /tmp/am/am.yml
          ./alertmanager-0.28.1.linux-amd64/amtool check-config /tmp/am/am.yml
      - run: python3 infra/observability/grafana/dashboards.py --check
