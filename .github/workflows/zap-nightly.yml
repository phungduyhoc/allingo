name: ZAP baseline (nightly, staging)

# S11 – OWASP ZAP baseline (spider + passive scan, không tấn công chủ động) hằng đêm trên staging.
# Ngưỡng nghiệm thu: 0 alert High (WARN-NEW/FAIL theo .zap/rules.tsv). Báo cáo HTML/JSON là artifact.
on:
  schedule:
    - cron: '17 19 * * *' # 02:17 giờ VN
  workflow_dispatch:
    inputs:
      target:
        description: URL web staging
        default: https://staging.allingo.vn
      api_target:
        description: URL API staging (OpenAPI)
        default: https://api-staging.allingo.vn

permissions:
  contents: read
  issues: write

jobs:
  zap-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target || 'https://staging.allingo.vn' }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j -T 15'
          fail_action: true
          allow_issue_writing: true
          artifact_name: zap-web
  zap-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: ${{ inputs.api_target || 'https://api-staging.allingo.vn' }}/v1/docs/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -T 15 -S'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api
